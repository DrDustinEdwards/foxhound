<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380"><title>MRR waterfall comparison — Company A vs Company B</title><desc>Two side-by-side MRR waterfall charts showing how Company A and Company B can post the same $10k net new MRR while having radically different gross movements, illustrating why net MRR alone hides the health signal.</desc><text x="40" y="24" class="label-primary">Same net MRR. Different gross. Different health.</text><text x="180" y="60" class="label-primary" text-anchor="middle">COMPANY A</text><text x="180" y="76" class="label-secondary" text-anchor="middle">high churn, replaced by new sales</text><path d="M40 210h280" class="baseline"/><path d="M40 100v210" class="axis"/><path d="M55 110h40v100H55z" class="node-success"/><text x="75" y="100" class="label-secondary" text-anchor="middle">+$50k</text><text x="75" y="324" class="label-secondary" text-anchor="middle">New</text><path d="M107 200h40v10h-40z" class="node-success"/><text x="127" y="194" class="label-secondary" text-anchor="middle">+$5k</text><text x="127" y="324" class="label-secondary" text-anchor="middle">Exp</text><path d="M159 210h40v40h-40z" class="node-warning"/><text x="179" y="262" class="label-secondary" text-anchor="middle">-$20k</text><text x="179" y="324" class="label-secondary" text-anchor="middle">Contr</text><path d="M211 210h40v50h-40z" class="node-warning"/><text x="231" y="272" class="label-secondary" text-anchor="middle">-$25k</text><text x="231" y="324" class="label-secondary" text-anchor="middle">Churn</text><path d="M263 190h40v20h-40z" class="node-accent"/><text x="283" y="184" class="label-primary accent" text-anchor="middle">+$10k</text><text x="283" y="324" class="label-secondary" text-anchor="middle">Net</text><text x="40" y="346" class="label-secondary">Churn = 50% of new. Hidden churn problem.</text><text x="500" y="60" class="label-primary" text-anchor="middle">COMPANY B</text><text x="500" y="76" class="label-secondary" text-anchor="middle">low churn, mostly expansion</text><path d="M360 210h280" class="baseline"/><path d="M360 100v210" class="axis"/><path d="M375 180h40v30h-40z" class="node-success"/><text x="395" y="174" class="label-secondary" text-anchor="middle">+$15k</text><text x="395" y="324" class="label-secondary" text-anchor="middle">New</text><path d="M427 194h40v16h-40z" class="node-success"/><text x="447" y="188" class="label-secondary" text-anchor="middle">+$8k</text><text x="447" y="324" class="label-secondary" text-anchor="middle">Exp</text><path d="M479 210h40v10h-40z" class="node-warning"/><text x="499" y="232" class="label-secondary" text-anchor="middle">-$5k</text><text x="499" y="324" class="label-secondary" text-anchor="middle">Contr</text><path d="M531 210h40v16h-40z" class="node-warning"/><text x="551" y="238" class="label-secondary" text-anchor="middle">-$8k</text><text x="551" y="324" class="label-secondary" text-anchor="middle">Churn</text><path d="M583 190h40v20h-40z" class="node-accent"/><text x="603" y="184" class="label-primary accent" text-anchor="middle">+$10k</text><text x="603" y="324" class="label-secondary" text-anchor="middle">Net</text><text x="360" y="346" class="label-secondary">Churn = 53% of new but on a small base. Healthy.</text></svg>
