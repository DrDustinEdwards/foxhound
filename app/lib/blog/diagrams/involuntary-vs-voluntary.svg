<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280"><title>Involuntary vs voluntary churn comparison</title><desc>Side-by-side comparison of involuntary churn (caused by payment failure with intent to stay) and voluntary churn (caused by customer decision to leave), each showing cause, customer intent, intervention, and tool.</desc><rect width="280" height="240" x="40" y="20" class="node-warning" rx="10"/><text x="180" y="50" class="header-warning" text-anchor="middle">INVOLUNTARY</text><text x="180" y="68" class="label-secondary" text-anchor="middle">they want to stay but the bill won&apos;t go through</text><path d="M60 84h240" class="divider"/><text x="60" y="110" class="label-secondary">Cause</text><text x="60" y="128" class="label-primary">Payment failure</text><text x="60" y="156" class="label-secondary">Customer intent</text><text x="60" y="174" class="label-primary">Stay subscribed</text><text x="60" y="202" class="label-secondary">Intervention</text><text x="60" y="220" class="label-primary">Recovery system</text><text x="60" y="246" class="label-secondary">Tool</text><text x="60" y="264" class="label-primary">Dunning sequence</text><rect width="280" height="240" x="360" y="20" class="node-info" rx="10"/><text x="500" y="50" class="header-info" text-anchor="middle">VOLUNTARY</text><text x="500" y="68" class="label-secondary" text-anchor="middle">they decided to leave and clicked cancel</text><path d="M380 84h240" class="divider"/><text x="380" y="110" class="label-secondary">Cause</text><text x="380" y="128" class="label-primary">Customer decision</text><text x="380" y="156" class="label-secondary">Customer intent</text><text x="380" y="174" class="label-primary">Leave</text><text x="380" y="202" class="label-secondary">Intervention</text><text x="380" y="220" class="label-primary">Product, pricing, CS</text><text x="380" y="246" class="label-secondary">Tool</text><text x="380" y="264" class="label-primary">Cancel flow + customer success</text></svg>
