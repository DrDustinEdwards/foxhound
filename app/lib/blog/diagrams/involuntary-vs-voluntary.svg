<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280"><title>Involuntary vs voluntary churn comparison</title><desc>Side-by-side comparison of involuntary churn (caused by payment failure with intent to stay) and voluntary churn (caused by customer decision to leave), each showing cause, customer intent, intervention, and tool.</desc><g class="ln red" transform="translate(40.0 28.0) scale(1.0)"><path d="M12 3L22 20H2z"/><path d="M12 10v5M12 17.5v.5"/></g><text x="74" y="45" class="header-warning" text-anchor="start">INVOLUNTARY</text><text x="40" y="68" class="label-secondary" text-anchor="start">they want to stay but the bill won&apos;t go through</text><path class="ln red" d="M40 84H300"/><text x="40" y="110" class="label-secondary" text-anchor="start">Cause</text><text x="40" y="128" class="label-primary" text-anchor="start">Payment failure</text><text x="40" y="156" class="label-secondary" text-anchor="start">Customer intent</text><text x="40" y="174" class="label-primary" text-anchor="start">Stay subscribed</text><text x="40" y="202" class="label-secondary" text-anchor="start">Intervention</text><text x="40" y="220" class="label-primary" text-anchor="start">Recovery system</text><text x="40" y="246" class="label-secondary" text-anchor="start">Tool</text><text x="40" y="264" class="label-primary" text-anchor="start">Dunning sequence</text><g class="ln blue" transform="translate(380.0 28.0) scale(1.0)"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-4 3-6 6-6M14 15h8M19 12l3 3l-3 3"/></g><text x="414" y="45" class="header-info" text-anchor="start">VOLUNTARY</text><text x="380" y="68" class="label-secondary" text-anchor="start">they decided to leave and clicked cancel</text><path class="ln blue" d="M380 84H640"/><text x="380" y="110" class="label-secondary" text-anchor="start">Cause</text><text x="380" y="128" class="label-primary" text-anchor="start">Customer decision</text><text x="380" y="156" class="label-secondary" text-anchor="start">Customer intent</text><text x="380" y="174" class="label-primary" text-anchor="start">Leave</text><text x="380" y="202" class="label-secondary" text-anchor="start">Intervention</text><text x="380" y="220" class="label-primary" text-anchor="start">Product, pricing, CS</text><text x="380" y="246" class="label-secondary" text-anchor="start">Tool</text><text x="380" y="264" class="label-primary" text-anchor="start">Cancel flow + customer success</text><path class="rule" d="M340 30V270"/></svg>
