<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372"><title>Stripe decline code taxonomy</title><desc>Four-category classification tree branching from a central decline_code received node into soft, card data, hard, and restriction categories, each showing the recovery action and four representative example codes.</desc><text x="340" y="26" class="label-primary" text-anchor="middle">decline_code received</text><text x="340" y="44" class="label-secondary" text-anchor="middle">via Stripe webhook</text><path class="ln brand" d="M340 54V86H60V344"/><path class="ln blue" d="M60 118H78"/><circle class="dot blue" cx="60" cy="118" r="3"/><g class="ln blue" transform="translate(89.2 107.2) scale(0.9)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g><text x="124" y="108" class="header-info" text-anchor="start">SOFT</text><text x="124" y="124" class="label-secondary" text-anchor="start">retry first</text><text x="124" y="140" class="label-secondary" text-anchor="start">temporary issuer condition</text><text x="292" y="112" class="label-mono" text-anchor="start">insufficient_funds</text><text x="472" y="112" class="label-mono" text-anchor="start">generic_decline</text><text x="292" y="132" class="label-mono" text-anchor="start">do_not_honor</text><text x="472" y="132" class="label-mono" text-anchor="start">processing_error</text><path class="rule" d="M78 156H640"/><path class="ln green" d="M60 190H78"/><circle class="dot green" cx="60" cy="190" r="3"/><g class="ln green" transform="translate(89.2 179.2) scale(0.9)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10H22M5 15H10"/></g><text x="124" y="180" class="lane-label-card" text-anchor="start">CARD DATA</text><text x="124" y="196" class="label-secondary" text-anchor="start">email day 1, no retry</text><text x="124" y="212" class="label-secondary" text-anchor="start">customer must update card</text><text x="292" y="184" class="label-mono" text-anchor="start">expired_card</text><text x="472" y="184" class="label-mono" text-anchor="start">incorrect_cvc</text><text x="292" y="204" class="label-mono" text-anchor="start">incorrect_zip</text><text x="472" y="204" class="label-mono" text-anchor="start">incorrect_number</text><path class="rule" d="M78 228H640"/><path class="ln red" d="M60 262H78"/><circle class="dot red" cx="60" cy="262" r="3"/><g class="ln red" transform="translate(89.2 251.2) scale(0.9)"><circle cx="12" cy="12" r="9"/><path d="M6 18L18 6"/></g><text x="124" y="252" class="header-warning" text-anchor="start">HARD</text><text x="124" y="268" class="label-secondary" text-anchor="start">no retry, email day 0</text><text x="124" y="284" class="label-secondary" text-anchor="start">issuer has said stop trying</text><text x="292" y="256" class="label-mono" text-anchor="start">lost_card</text><text x="472" y="256" class="label-mono" text-anchor="start">stolen_card</text><text x="292" y="276" class="label-mono" text-anchor="start">fraudulent</text><text x="472" y="276" class="label-mono" text-anchor="start">do_not_try_again</text><path class="rule" d="M78 300H640"/><path class="ln " d="M60 334H78"/><circle class="dot " cx="60" cy="334" r="3"/><g class="ln " transform="translate(89.2 323.2) scale(0.9)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="124" y="324" class="header" text-anchor="start">RESTRICTION</text><text x="124" y="340" class="label-secondary" text-anchor="start">email + call issuer</text><text x="124" y="356" class="label-secondary" text-anchor="start">restriction on the card or account</text><text x="292" y="328" class="label-mono" text-anchor="start">call_issuer</text><text x="472" y="328" class="label-mono" text-anchor="start">transaction_not_allowed</text><text x="292" y="348" class="label-mono" text-anchor="start">card_velocity_exceeded</text><text x="472" y="348" class="label-mono" text-anchor="start">revocation_of_authorization</text></svg>
