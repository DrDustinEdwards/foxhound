<svg xmlns="http://www.w3.org/2000/svg" width="680" height="468" viewBox="0 0 680 468"><title>Stripe decline code taxonomy</title><desc>Classification tree. The decline code on the failed charge is sorted into one of six categories. Soft (insufficient_funds, do_not_honor, generic_decline, card_declined): retry first, then email. Network (processing_error, issuer_not_available, try_again_later, reenter_transaction): retry within hours. Expired (expired_card, invalid_expiry_month, invalid_expiry_year): email the card-update link; a retry waits for a new card. Fraud (fraudulent, lost_card, stolen_card, do_not_try_again): email only, never retried. Revoked (revocation_of_authorization, revocation_of_all_authorizations): one email, never retried. Unknown (any code not listed, such as card_not_supported): email only, never retried.</desc><text x="340" y="26" class="label-primary" text-anchor="middle">decline_code on the failed charge</text><text x="340" y="44" class="label-secondary" text-anchor="middle">sorted into one of six categories</text><path class="ln accent" d="M340 54V66H60V430"/><g data-category="soft"><path class="ln accent" d="M60 100H78"/><circle class="dot accent" cx="60" cy="100" r="3"/><g class="ln accent" transform="translate(89.2 89.2) scale(0.9)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g><text x="124" y="90" class="header accent">SOFT</text><text x="124" y="106" class="label-secondary">retry first, then email</text><text x="124" y="122" class="label-secondary">a temporary issuer condition</text><text x="320" y="94" class="label-mono" data-code="insufficient_funds">insufficient_funds</text><text x="490" y="94" class="label-mono" data-code="do_not_honor">do_not_honor</text><text x="320" y="114" class="label-mono" data-code="generic_decline">generic_decline</text><text x="490" y="114" class="label-mono" data-code="card_declined">card_declined</text></g><path class="rule" d="M78 136H640"/><g data-category="network"><path class="ln accent" d="M60 166H78"/><circle class="dot accent" cx="60" cy="166" r="3"/><g class="ln accent" transform="translate(89.2 155.2) scale(0.9)"><path d="M2 12h4l3-8 6 16 3-8h4"/></g><text x="124" y="156" class="header accent">NETWORK</text><text x="124" y="172" class="label-secondary">retry within hours</text><text x="124" y="188" class="label-secondary">a processing or issuer error</text><text x="320" y="160" class="label-mono" data-code="processing_error">processing_error</text><text x="490" y="160" class="label-mono" data-code="issuer_not_available">issuer_not_available</text><text x="320" y="180" class="label-mono" data-code="try_again_later">try_again_later</text><text x="490" y="180" class="label-mono" data-code="reenter_transaction">reenter_transaction</text></g><path class="rule" d="M78 202H640"/><g data-category="expired"><path class="ln info" d="M60 232H78"/><circle class="dot info" cx="60" cy="232" r="3"/><g class="ln info" transform="translate(89.2 221.2) scale(0.9)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10H22M5 15H10"/></g><text x="124" y="222" class="header info">EXPIRED</text><text x="124" y="238" class="label-secondary">email the card-update link</text><text x="124" y="254" class="label-secondary">a retry waits for a new card</text><text x="320" y="226" class="label-mono" data-code="expired_card">expired_card</text><text x="490" y="226" class="label-mono" data-code="invalid_expiry_month">invalid_expiry_month</text><text x="320" y="246" class="label-mono" data-code="invalid_expiry_year">invalid_expiry_year</text></g><path class="rule" d="M78 268H640"/><g data-category="fraud"><path class="ln warning" d="M60 298H78"/><circle class="dot warning" cx="60" cy="298" r="3"/><g class="ln warning" transform="translate(89.2 287.2) scale(0.9)"><circle cx="12" cy="12" r="9"/><path d="M6 18L18 6"/></g><text x="124" y="288" class="header warning">FRAUD</text><text x="124" y="304" class="label-secondary">email only, never retried</text><text x="124" y="320" class="label-secondary">the issuer said stop trying</text><text x="320" y="292" class="label-mono" data-code="fraudulent">fraudulent</text><text x="490" y="292" class="label-mono" data-code="lost_card">lost_card</text><text x="320" y="312" class="label-mono" data-code="stolen_card">stolen_card</text><text x="490" y="312" class="label-mono" data-code="do_not_try_again">do_not_try_again</text></g><path class="rule" d="M78 334H640"/><g data-category="revoked"><path class="ln warning" d="M60 364H78"/><circle class="dot warning" cx="60" cy="364" r="3"/><g class="ln warning" transform="translate(89.2 353.2) scale(0.9)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="124" y="354" class="header warning">REVOKED</text><text x="124" y="370" class="label-secondary">one email, never retried</text><text x="124" y="386" class="label-secondary">customer blocked the charges</text><text x="320" y="358" class="label-mono" data-code="revocation_of_authorization">revocation_of_authorization</text><text x="320" y="378" class="label-mono" data-code="revocation_of_all_authorizations">revocation_of_all_authorizations</text></g><path class="rule" d="M78 400H640"/><g data-category="unknown"><path class="ln" d="M60 430H78"/><circle class="dot" cx="60" cy="430" r="3"/><g class="ln" transform="translate(89.2 419.2) scale(0.9)"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></g><text x="124" y="420" class="header">UNKNOWN</text><text x="124" y="436" class="label-secondary">email only, never retried</text><text x="124" y="452" class="label-secondary">any code not listed above</text><text x="320" y="424" class="label-mono" data-code="card_not_supported">card_not_supported</text></g></svg>
