<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400"><title>Stripe decline code taxonomy</title><desc>Four-category classification tree branching from a central decline_code received node into soft, card data, hard, and restriction categories, each showing the recovery action and four representative example codes.</desc><defs><marker id="arrow-dct" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" class="arrow-head"/></marker></defs><rect width="240" height="50" x="220" y="20" class="node-accent" rx="8"/><text x="340" y="44" class="label-primary" text-anchor="middle">decline_code received</text><text x="340" y="60" class="label-secondary" text-anchor="middle">via Stripe webhook</text><path d="M340 70v30M123 100h434" class="connector"/><path marker-end="url(#arrow-dct)" d="M123 100v20" class="connector"/><path marker-end="url(#arrow-dct)" d="M268 100v20" class="connector"/><path marker-end="url(#arrow-dct)" d="M413 100v20" class="connector"/><path marker-end="url(#arrow-dct)" d="M557 100v20" class="connector"/><rect width="140" height="245" x="53" y="125" class="node-info" rx="8"/><text x="123" y="148" class="header" text-anchor="middle">SOFT</text><text x="123" y="166" class="label-secondary" text-anchor="middle">retry first</text><path d="M65 180h116" class="connector"/><text x="63" y="204" class="label-mono">insufficient_funds</text><text x="63" y="226" class="label-mono">generic_decline</text><text x="63" y="248" class="label-mono">do_not_honor</text><text x="63" y="270" class="label-mono">processing_error</text><text x="123" y="320" class="label-secondary" text-anchor="middle">temporary</text><text x="123" y="336" class="label-secondary" text-anchor="middle">issuer condition</text><rect width="140" height="245" x="198" y="125" class="node-success" rx="8"/><text x="268" y="148" class="header" text-anchor="middle">CARD DATA</text><text x="268" y="166" class="label-secondary" text-anchor="middle">email day 1, no retry</text><path d="M210 180h116" class="connector"/><text x="208" y="204" class="label-mono">expired_card</text><text x="208" y="226" class="label-mono">incorrect_cvc</text><text x="208" y="248" class="label-mono">incorrect_zip</text><text x="208" y="270" class="label-mono">incorrect_number</text><text x="268" y="320" class="label-secondary" text-anchor="middle">customer must</text><text x="268" y="336" class="label-secondary" text-anchor="middle">update card</text><rect width="140" height="245" x="343" y="125" class="node-warning" rx="8"/><text x="413" y="148" class="header" text-anchor="middle">HARD</text><text x="413" y="166" class="label-secondary" text-anchor="middle">no retry, email day 0</text><path d="M355 180h116" class="connector"/><text x="353" y="204" class="label-mono">lost_card</text><text x="353" y="226" class="label-mono">stolen_card</text><text x="353" y="248" class="label-mono">fraudulent</text><text x="353" y="270" class="label-mono">do_not_try_again</text><text x="413" y="320" class="label-secondary" text-anchor="middle">issuer has said</text><text x="413" y="336" class="label-secondary" text-anchor="middle">stop trying</text><rect width="140" height="245" x="487" y="125" class="node-neutral" rx="8"/><text x="557" y="148" class="header" text-anchor="middle">RESTRICTION</text><text x="557" y="166" class="label-secondary" text-anchor="middle">email + call issuer</text><path d="M499 180h116" class="connector"/><text x="497" y="204" class="label-mono">call_issuer</text><text x="497" y="226" class="label-mono">transaction_not_allowed</text><text x="497" y="248" class="label-mono">card_velocity_exceeded</text><text x="497" y="270" class="label-mono">revocation_of_authorization</text><text x="557" y="320" class="label-secondary" text-anchor="middle">restriction on</text><text x="557" y="336" class="label-secondary" text-anchor="middle">the card or account</text></svg>
