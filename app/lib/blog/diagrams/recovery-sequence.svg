<svg xmlns="http://www.w3.org/2000/svg" width="680" height="782" viewBox="0 0 680 782"><title>Stripe failed-payment recovery sequence by decline category</title><desc>Flowchart. The invoice.payment_failed webhook arrives and Foxhound classifies the decline code into one of six categories. For soft, network and unknown declines Foxhound waits until Stripe stops retrying; for expired, fraud and revoked declines it starts at once, because Stripe will not retry the same card. From day 0 each category runs its own steps. Soft: retry at 4 hours, email at 5 hours, retry on day 2, emails on days 3, 7 and 14, retry on day 21, email on day 30. Network: retry at 4 hours, retry on day 1, email on day 2, emails on days 7 and 14, retry on day 21, email on day 30. Expired: email at 1 hour, emails on days 3, 7 and 14, a day 21 retry only if the card has been updated, email on day 30. Fraud: emails at 2 hours and on days 3, 7, 14 and 30. Revoked: one email at 2 hours. Unknown: emails at 1 hour and on days 3, 7, 14 and 30. If the invoice is paid at any point, the steps still ahead are canceled. If every step runs and the invoice is still unpaid, the merchant gets a notice.</desc><defs><marker id="arrow-rs" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" class="arrow-head"/></marker></defs><rect width="260" height="56" x="210" y="20" class="node-accent" rx="3"/><text x="340" y="42" class="label-primary" text-anchor="middle">Stripe webhook fires</text><text x="340" y="60" class="label-mono" text-anchor="middle">invoice.payment_failed</text><path marker-end="url(#arrow-rs)" d="M340 76v22" class="connector"/><rect width="260" height="56" x="210" y="98" class="node-neutral" rx="3"/><text x="340" y="120" class="label-primary" text-anchor="middle">Classify the decline code</text><text x="340" y="138" class="label-secondary" text-anchor="middle">into one of six categories</text><path d="M340 154v16M180 170h320" class="connector"/><path marker-end="url(#arrow-rs)" d="M180 170v18" class="connector"/><path marker-end="url(#arrow-rs)" d="M500 170v18" class="connector"/><rect width="300" height="56" x="30" y="188" class="node-neutral" rx="3"/><text x="180" y="210" class="label-primary" text-anchor="middle">Soft, network, unknown</text><text x="180" y="228" class="label-secondary" text-anchor="middle">wait until Stripe stops retrying</text><rect width="300" height="56" x="350" y="188" class="node-neutral" rx="3"/><text x="500" y="210" class="label-primary" text-anchor="middle">Expired, fraud, revoked</text><text x="500" y="228" class="label-secondary" text-anchor="middle">start now: Stripe will not retry this card</text><path d="M180 244v16M500 244v16M180 260h320" class="connector"/><path marker-end="url(#arrow-rs)" d="M340 260v18" class="connector"/><rect width="260" height="40" x="210" y="278" class="node-accent" rx="3"/><text x="340" y="300" class="label-primary" text-anchor="middle">Day 0: the sequence starts</text><path d="M340 318v16M61 334H621" class="connector"/><path marker-end="url(#arrow-rs)" d="M61 334v16" class="connector"/><text x="61" y="368" class="header accent" text-anchor="middle">SOFT</text><g data-category="soft"><rect width="102" height="24" x="10" y="380" class="node-accent" rx="3"/><text x="20" y="396" class="label-mono">4h<tspan x="102" class="label-secondary" text-anchor="end">retry</tspan></text><rect width="102" height="24" x="10" y="412" class="node-info" rx="3"/><text x="20" y="428" class="label-mono">5h<tspan x="102" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="10" y="444" class="node-accent" rx="3"/><text x="20" y="460" class="label-mono">D2<tspan x="102" class="label-secondary" text-anchor="end">retry</tspan></text><rect width="102" height="24" x="10" y="476" class="node-info" rx="3"/><text x="20" y="492" class="label-mono">D3<tspan x="102" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="10" y="508" class="node-info" rx="3"/><text x="20" y="524" class="label-mono">D7<tspan x="102" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="10" y="540" class="node-info" rx="3"/><text x="20" y="556" class="label-mono">D14<tspan x="102" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="10" y="572" class="node-accent" rx="3"/><text x="20" y="588" class="label-mono">D21<tspan x="102" class="label-secondary" text-anchor="end">retry</tspan></text><rect width="102" height="24" x="10" y="604" class="node-info" rx="3"/><text x="20" y="620" class="label-mono">D30<tspan x="102" class="label-secondary" text-anchor="end">email</tspan></text></g><path marker-end="url(#arrow-rs)" d="M173 334v16" class="connector"/><text x="173" y="368" class="header accent" text-anchor="middle">NETWORK</text><g data-category="network"><rect width="102" height="24" x="122" y="380" class="node-accent" rx="3"/><text x="132" y="396" class="label-mono">4h<tspan x="214" class="label-secondary" text-anchor="end">retry</tspan></text><rect width="102" height="24" x="122" y="412" class="node-accent" rx="3"/><text x="132" y="428" class="label-mono">D1<tspan x="214" class="label-secondary" text-anchor="end">retry</tspan></text><rect width="102" height="24" x="122" y="444" class="node-info" rx="3"/><text x="132" y="460" class="label-mono">D2<tspan x="214" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="122" y="476" class="node-info" rx="3"/><text x="132" y="492" class="label-mono">D7<tspan x="214" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="122" y="508" class="node-info" rx="3"/><text x="132" y="524" class="label-mono">D14<tspan x="214" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="122" y="540" class="node-accent" rx="3"/><text x="132" y="556" class="label-mono">D21<tspan x="214" class="label-secondary" text-anchor="end">retry</tspan></text><rect width="102" height="24" x="122" y="572" class="node-info" rx="3"/><text x="132" y="588" class="label-mono">D30<tspan x="214" class="label-secondary" text-anchor="end">email</tspan></text></g><path marker-end="url(#arrow-rs)" d="M285 334v16" class="connector"/><text x="285" y="368" class="header info" text-anchor="middle">EXPIRED</text><g data-category="expired"><rect width="102" height="24" x="234" y="380" class="node-info" rx="3"/><text x="244" y="396" class="label-mono">1h<tspan x="326" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="234" y="412" class="node-info" rx="3"/><text x="244" y="428" class="label-mono">D3<tspan x="326" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="234" y="444" class="node-info" rx="3"/><text x="244" y="460" class="label-mono">D7<tspan x="326" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="234" y="476" class="node-info" rx="3"/><text x="244" y="492" class="label-mono">D14<tspan x="326" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="234" y="508" class="node-accent" stroke-dasharray="3 2" rx="3"/><text x="244" y="524" class="label-mono">D21<tspan x="326" class="label-secondary" text-anchor="end">retry</tspan></text><rect width="102" height="24" x="234" y="540" class="node-info" rx="3"/><text x="244" y="556" class="label-mono">D30<tspan x="326" class="label-secondary" text-anchor="end">email</tspan></text></g><path marker-end="url(#arrow-rs)" d="M397 334v16" class="connector"/><text x="397" y="368" class="header warning" text-anchor="middle">FRAUD</text><g data-category="fraud"><rect width="102" height="24" x="346" y="380" class="node-info" rx="3"/><text x="356" y="396" class="label-mono">2h<tspan x="438" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="346" y="412" class="node-info" rx="3"/><text x="356" y="428" class="label-mono">D3<tspan x="438" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="346" y="444" class="node-info" rx="3"/><text x="356" y="460" class="label-mono">D7<tspan x="438" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="346" y="476" class="node-info" rx="3"/><text x="356" y="492" class="label-mono">D14<tspan x="438" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="346" y="508" class="node-info" rx="3"/><text x="356" y="524" class="label-mono">D30<tspan x="438" class="label-secondary" text-anchor="end">email</tspan></text></g><path marker-end="url(#arrow-rs)" d="M509 334v16" class="connector"/><text x="509" y="368" class="header warning" text-anchor="middle">REVOKED</text><g data-category="revoked"><rect width="102" height="24" x="458" y="380" class="node-info" rx="3"/><text x="468" y="396" class="label-mono">2h<tspan x="550" class="label-secondary" text-anchor="end">email</tspan></text></g><path marker-end="url(#arrow-rs)" d="M621 334v16" class="connector"/><text x="621" y="368" class="header" text-anchor="middle">UNKNOWN</text><g data-category="unknown"><rect width="102" height="24" x="570" y="380" class="node-info" rx="3"/><text x="580" y="396" class="label-mono">1h<tspan x="662" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="570" y="412" class="node-info" rx="3"/><text x="580" y="428" class="label-mono">D3<tspan x="662" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="570" y="444" class="node-info" rx="3"/><text x="580" y="460" class="label-mono">D7<tspan x="662" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="570" y="476" class="node-info" rx="3"/><text x="580" y="492" class="label-mono">D14<tspan x="662" class="label-secondary" text-anchor="end">email</tspan></text><rect width="102" height="24" x="570" y="508" class="node-info" rx="3"/><text x="580" y="524" class="label-mono">D30<tspan x="662" class="label-secondary" text-anchor="end">email</tspan></text></g><path d="M61 628V646" class="connector quiet"/><path d="M173 596V646" class="connector quiet"/><path d="M285 564V646" class="connector quiet"/><path d="M397 532V646" class="connector quiet"/><path d="M509 404V646" class="connector quiet"/><path d="M621 532V646" class="connector quiet"/><path d="M61 646H621" class="connector quiet"/><path marker-end="url(#arrow-rs)" d="M180 646v20" class="connector"/><path marker-end="url(#arrow-rs)" d="M500 646v20" class="connector"/><rect width="300" height="74" x="30" y="666" class="node-success" rx="3"/><text x="180" y="688" class="header" text-anchor="middle">RECOVERED</text><text x="180" y="706" class="label-secondary" text-anchor="middle">the invoice is paid at any point</text><text x="180" y="724" class="label-secondary" text-anchor="middle">every step still ahead is canceled</text><rect width="300" height="74" x="350" y="666" class="node-warning" rx="3"/><text x="500" y="688" class="header" text-anchor="middle">NOT RECOVERED</text><text x="500" y="706" class="label-secondary" text-anchor="middle">every step ran and the invoice is unpaid</text><text x="500" y="724" class="label-secondary" text-anchor="middle">the merchant gets a notice</text><text x="340" y="766" class="label-secondary" text-anchor="middle">h is hours and D is days after day 0. Dashed: retries only once the card is updated.</text></svg>
