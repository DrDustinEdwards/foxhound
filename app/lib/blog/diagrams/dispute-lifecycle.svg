<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220"><title>Stripe dispute lifecycle</title><desc>Five-stage horizontal timeline of a Stripe dispute, from the cardholder contacting their bank through funds being frozen, notification, the evidence window, and the issuer&apos;s final decision.</desc><path class="ln" d="M50 100H630"/><path class="ln" d="M157 94L163 100L157 106"/><circle class="ring" cx="100" cy="100" r="22"/><g class="ln" transform="translate(89.2 89.2) scale(0.9)"><path d="M3 10L12 4l9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/></g><text x="100" y="26" class="label-secondary" text-anchor="middle">Stage 1</text><text x="100" y="44" class="label-primary" text-anchor="middle">Cardholder</text><text x="100" y="60" class="label-primary" text-anchor="middle">contacts bank</text><text x="100" y="146" class="label-secondary" text-anchor="middle">Day 0</text><path class="ln" d="M277 94L283 100L277 106"/><circle class="ring warning" cx="220" cy="100" r="22"/><g class="ln warning" transform="translate(209.2 89.2) scale(0.9)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g><text x="220" y="26" class="label-secondary" text-anchor="middle">Stage 2</text><text x="220" y="44" class="label-primary" text-anchor="middle">Funds frozen</text><text x="220" y="60" class="label-primary" text-anchor="middle">automatically</text><text x="220" y="146" class="label-secondary" text-anchor="middle">Instant</text><path class="ln" d="M397 94L403 100L397 106"/><circle class="ring info" cx="340" cy="100" r="22"/><g class="ln info" transform="translate(329.2 89.2) scale(0.9)"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></g><text x="340" y="26" class="label-secondary" text-anchor="middle">Stage 3</text><text x="340" y="44" class="label-primary" text-anchor="middle">Webhook +</text><text x="340" y="60" class="label-primary" text-anchor="middle">notification</text><text x="340" y="146" class="label-secondary" text-anchor="middle">Hours</text><path class="ln" d="M517 94L523 100L517 106"/><circle class="ring accent" cx="460" cy="100" r="22"/><g class="ln accent" transform="translate(449.2 89.2) scale(0.9)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g><text x="460" y="26" class="label-secondary" text-anchor="middle">Stage 4</text><text x="460" y="44" class="label-primary" text-anchor="middle">Evidence</text><text x="460" y="60" class="label-primary" text-anchor="middle">window</text><text x="460" y="146" class="label-secondary" text-anchor="middle">7-21 days</text><circle class="ring" cx="580" cy="100" r="22"/><g class="ln" transform="translate(569.2 89.2) scale(0.9)"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3l5-6"/></g><text x="580" y="26" class="label-secondary" text-anchor="middle">Stage 5</text><text x="580" y="44" class="label-primary" text-anchor="middle">Issuer</text><text x="580" y="60" class="label-primary" text-anchor="middle">decides</text><text x="580" y="146" class="label-secondary" text-anchor="middle">60-90 days</text><path class="ln warning" d="M420 164v6h80v-6"/><text x="460" y="188" class="label-secondary warning" text-anchor="middle">Hard deadline</text><text x="460" y="204" class="label-secondary" text-anchor="middle">Miss it and the dispute is lost</text></svg>
