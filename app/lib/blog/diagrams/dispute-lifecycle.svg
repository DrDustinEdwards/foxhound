<svg xmlns="http://www.w3.org/2000/svg" width="680" height="220" viewBox="0 0 680 220"><title>Stripe dispute lifecycle</title><desc>Five-stage horizontal timeline of a Stripe dispute, from the cardholder contacting their bank through funds being frozen, notification, the evidence window, and the issuer&apos;s final decision.</desc><defs><marker id="arrow-dl" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" class="arrow-head"/></marker></defs><rect width="100" height="64" x="50" y="40" class="node-neutral" rx="8"/><text x="100" y="64" class="label-primary" text-anchor="middle">Stage 1</text><text x="100" y="82" class="label-secondary" text-anchor="middle">Cardholder</text><text x="100" y="96" class="label-secondary" text-anchor="middle">contacts bank</text><rect width="100" height="64" x="170" y="40" class="node-warning" rx="8"/><text x="220" y="64" class="label-primary" text-anchor="middle">Stage 2</text><text x="220" y="82" class="label-secondary" text-anchor="middle">Funds frozen</text><text x="220" y="96" class="label-secondary" text-anchor="middle">automatically</text><rect width="100" height="64" x="290" y="40" class="node-info" rx="8"/><text x="340" y="64" class="label-primary" text-anchor="middle">Stage 3</text><text x="340" y="82" class="label-secondary" text-anchor="middle">Webhook +</text><text x="340" y="96" class="label-secondary" text-anchor="middle">notification</text><rect width="100" height="64" x="410" y="40" class="node-accent" rx="8"/><text x="460" y="64" class="label-primary" text-anchor="middle">Stage 4</text><text x="460" y="82" class="label-secondary" text-anchor="middle">Evidence</text><text x="460" y="96" class="label-secondary" text-anchor="middle">window</text><rect width="100" height="64" x="530" y="40" class="node-neutral" rx="8"/><text x="580" y="64" class="label-primary" text-anchor="middle">Stage 5</text><text x="580" y="82" class="label-secondary" text-anchor="middle">Issuer</text><text x="580" y="96" class="label-secondary" text-anchor="middle">decides</text><path marker-end="url(#arrow-dl)" d="M150 72h20" class="connector"/><path marker-end="url(#arrow-dl)" d="M270 72h20" class="connector"/><path marker-end="url(#arrow-dl)" d="M390 72h20" class="connector"/><path marker-end="url(#arrow-dl)" d="M510 72h20" class="connector"/><path d="M50 140h580" class="connector"/><text x="100" y="158" class="label-secondary" text-anchor="middle">Day 0</text><text x="220" y="158" class="label-secondary" text-anchor="middle">Instant</text><text x="340" y="158" class="label-secondary" text-anchor="middle">Hours</text><text x="460" y="158" class="label-secondary" text-anchor="middle">7-21 days</text><text x="580" y="158" class="label-secondary" text-anchor="middle">60-90 days</text><text x="460" y="184" class="label-warning" text-anchor="middle">Hard deadline</text><text x="460" y="200" class="label-secondary" text-anchor="middle">Miss it and the dispute is lost</text></svg>
