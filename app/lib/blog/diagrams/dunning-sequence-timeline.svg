<svg xmlns="http://www.w3.org/2000/svg" width="680" height="442" viewBox="0 0 680 442"><title>Recovery sequence timeline by decline category</title><desc>Six timelines, one per decline category, from day 0 (when the sequence starts) to day 30. Soft: retry at 4 hours, email at 5 hours, retry day 2, emails days 3, 7 and 14, retry day 21, email day 30. Network: retries at 4 hours and day 1, emails days 2, 7 and 14, retry day 21, email day 30. Expired: emails at 1 hour and days 3, 7, 14 and 30, and a day 21 retry only on an updated card. Fraud: emails at 2 hours and days 3, 7, 14 and 30. Revoked: one email at 2 hours. Unknown: emails at 1 hour and days 3, 7, 14 and 30.</desc><defs><symbol id="tl-retry" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></symbol><symbol id="tl-email" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></symbol></defs><circle cx="34" cy="22" r="8" class="node-accent"/><use href="#tl-retry" x="28" y="16" width="12" height="12" class="ln accent"/><text x="48" y="26" class="label-secondary">retry</text><circle cx="112" cy="22" r="8" class="node-info"/><use href="#tl-email" x="106" y="16" width="12" height="12" class="ln info"/><text x="126" y="26" class="label-secondary">email</text><circle cx="190" cy="22" r="8" class="node-accent" stroke-dasharray="3 2"/><use href="#tl-retry" x="184" y="16" width="12" height="12" class="ln accent"/><text x="204" y="26" class="label-secondary">retry, only after a card update</text><text x="24" y="79" class="header accent">SOFT</text><text x="24" y="95" class="label-secondary">retry, then email</text><path d="M200 82H662" class="lane"/><g data-category="soft"><g data-hours="4"><circle cx="203" cy="82" r="9" class="node-accent"/><use href="#tl-retry" x="197" y="76" width="12" height="12" class="ln accent"/><text x="203" y="105" class="label-secondary" text-anchor="middle">4h</text></g><g data-hours="5"><circle cx="225" cy="82" r="9" class="node-info"/><use href="#tl-email" x="219" y="76" width="12" height="12" class="ln info"/><text x="225" y="105" class="label-secondary" text-anchor="middle">5h</text></g><g data-hours="48"><circle cx="338" cy="82" r="9" class="node-accent"/><use href="#tl-retry" x="332" y="76" width="12" height="12" class="ln accent"/></g><g data-hours="72"><circle cx="400" cy="82" r="9" class="node-info"/><use href="#tl-email" x="394" y="76" width="12" height="12" class="ln info"/></g><g data-hours="168"><circle cx="462" cy="82" r="9" class="node-info"/><use href="#tl-email" x="456" y="76" width="12" height="12" class="ln info"/></g><g data-hours="336"><circle cx="524" cy="82" r="9" class="node-info"/><use href="#tl-email" x="518" y="76" width="12" height="12" class="ln info"/></g><g data-hours="504"><circle cx="586" cy="82" r="9" class="node-accent"/><use href="#tl-retry" x="580" y="76" width="12" height="12" class="ln accent"/></g><g data-hours="720"><circle cx="648" cy="82" r="9" class="node-info"/><use href="#tl-email" x="642" y="76" width="12" height="12" class="ln info"/></g></g><text x="24" y="133" class="header accent">NETWORK</text><text x="24" y="149" class="label-secondary">two retries, then email</text><path d="M200 136H662" class="lane"/><g data-category="network"><g data-hours="4"><circle cx="214" cy="136" r="9" class="node-accent"/><use href="#tl-retry" x="208" y="130" width="12" height="12" class="ln accent"/><text x="214" y="159" class="label-secondary" text-anchor="middle">4h</text></g><g data-hours="24"><circle cx="276" cy="136" r="9" class="node-accent"/><use href="#tl-retry" x="270" y="130" width="12" height="12" class="ln accent"/></g><g data-hours="48"><circle cx="338" cy="136" r="9" class="node-info"/><use href="#tl-email" x="332" y="130" width="12" height="12" class="ln info"/></g><g data-hours="168"><circle cx="462" cy="136" r="9" class="node-info"/><use href="#tl-email" x="456" y="130" width="12" height="12" class="ln info"/></g><g data-hours="336"><circle cx="524" cy="136" r="9" class="node-info"/><use href="#tl-email" x="518" y="130" width="12" height="12" class="ln info"/></g><g data-hours="504"><circle cx="586" cy="136" r="9" class="node-accent"/><use href="#tl-retry" x="580" y="130" width="12" height="12" class="ln accent"/></g><g data-hours="720"><circle cx="648" cy="136" r="9" class="node-info"/><use href="#tl-email" x="642" y="130" width="12" height="12" class="ln info"/></g></g><text x="24" y="187" class="header info">EXPIRED</text><text x="24" y="203" class="label-secondary">email the update link</text><path d="M200 190H662" class="lane"/><g data-category="expired"><g data-hours="1"><circle cx="214" cy="190" r="9" class="node-info"/><use href="#tl-email" x="208" y="184" width="12" height="12" class="ln info"/><text x="214" y="213" class="label-secondary" text-anchor="middle">1h</text></g><g data-hours="72"><circle cx="400" cy="190" r="9" class="node-info"/><use href="#tl-email" x="394" y="184" width="12" height="12" class="ln info"/></g><g data-hours="168"><circle cx="462" cy="190" r="9" class="node-info"/><use href="#tl-email" x="456" y="184" width="12" height="12" class="ln info"/></g><g data-hours="336"><circle cx="524" cy="190" r="9" class="node-info"/><use href="#tl-email" x="518" y="184" width="12" height="12" class="ln info"/></g><g data-hours="504"><circle cx="586" cy="190" r="9" class="node-accent" stroke-dasharray="3 2"/><use href="#tl-retry" x="580" y="184" width="12" height="12" class="ln accent"/></g><g data-hours="720"><circle cx="648" cy="190" r="9" class="node-info"/><use href="#tl-email" x="642" y="184" width="12" height="12" class="ln info"/></g></g><text x="24" y="241" class="header warning">FRAUD</text><text x="24" y="257" class="label-secondary">email only</text><path d="M200 244H662" class="lane"/><g data-category="fraud"><g data-hours="2"><circle cx="214" cy="244" r="9" class="node-info"/><use href="#tl-email" x="208" y="238" width="12" height="12" class="ln info"/><text x="214" y="267" class="label-secondary" text-anchor="middle">2h</text></g><g data-hours="72"><circle cx="400" cy="244" r="9" class="node-info"/><use href="#tl-email" x="394" y="238" width="12" height="12" class="ln info"/></g><g data-hours="168"><circle cx="462" cy="244" r="9" class="node-info"/><use href="#tl-email" x="456" y="238" width="12" height="12" class="ln info"/></g><g data-hours="336"><circle cx="524" cy="244" r="9" class="node-info"/><use href="#tl-email" x="518" y="238" width="12" height="12" class="ln info"/></g><g data-hours="720"><circle cx="648" cy="244" r="9" class="node-info"/><use href="#tl-email" x="642" y="238" width="12" height="12" class="ln info"/></g></g><text x="24" y="295" class="header warning">REVOKED</text><text x="24" y="311" class="label-secondary">one email</text><path d="M200 298H662" class="lane"/><g data-category="revoked"><g data-hours="2"><circle cx="214" cy="298" r="9" class="node-info"/><use href="#tl-email" x="208" y="292" width="12" height="12" class="ln info"/><text x="214" y="321" class="label-secondary" text-anchor="middle">2h</text></g></g><text x="24" y="349" class="header">UNKNOWN</text><text x="24" y="365" class="label-secondary">email only</text><path d="M200 352H662" class="lane"/><g data-category="unknown"><g data-hours="1"><circle cx="214" cy="352" r="9" class="node-info"/><use href="#tl-email" x="208" y="346" width="12" height="12" class="ln info"/><text x="214" y="375" class="label-secondary" text-anchor="middle">1h</text></g><g data-hours="72"><circle cx="400" cy="352" r="9" class="node-info"/><use href="#tl-email" x="394" y="346" width="12" height="12" class="ln info"/></g><g data-hours="168"><circle cx="462" cy="352" r="9" class="node-info"/><use href="#tl-email" x="456" y="346" width="12" height="12" class="ln info"/></g><g data-hours="336"><circle cx="524" cy="352" r="9" class="node-info"/><use href="#tl-email" x="518" y="346" width="12" height="12" class="ln info"/></g><g data-hours="720"><circle cx="648" cy="352" r="9" class="node-info"/><use href="#tl-email" x="642" y="346" width="12" height="12" class="ln info"/></g></g><path d="M200 392H662" class="axis-line"/><path d="M214 388v8M276 388v8M338 388v8M400 388v8M462 388v8M524 388v8M586 388v8M648 388v8" class="axis-tick"/><text x="214" y="410" class="label-secondary" text-anchor="middle">D0</text><text x="276" y="410" class="label-secondary" text-anchor="middle">D1</text><text x="338" y="410" class="label-secondary" text-anchor="middle">D2</text><text x="400" y="410" class="label-secondary" text-anchor="middle">D3</text><text x="462" y="410" class="label-secondary" text-anchor="middle">D7</text><text x="524" y="410" class="label-secondary" text-anchor="middle">D14</text><text x="586" y="410" class="label-secondary" text-anchor="middle">D21</text><text x="648" y="410" class="label-secondary" text-anchor="middle">D30</text><text x="431" y="430" class="label-secondary" text-anchor="middle">days after the sequence starts (days not to scale)</text></svg>
