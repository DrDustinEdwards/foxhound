<svg xmlns="http://www.w3.org/2000/svg" width="680" height="442" viewBox="0 0 680 442"><title>Recovery sequence timeline by decline category</title><desc>Six timelines, one per decline category, from day 0 to day 30, where day 0 is when the sequence starts. Soft: retry at 4 hours, email at 5 hours, retry on day 2, emails on days 3, 7 and 14, retry on day 21, email on day 30. Network: retry at 4 hours, retry on day 1, email on day 2, emails on days 7 and 14, retry on day 21, email on day 30. Expired: email at 1 hour, emails on days 3, 7 and 14, a day 21 retry that runs only if the card has been updated, email on day 30. Fraud: email at 2 hours, then emails on days 3, 7, 14 and 30, never a retry. Revoked: one email at 2 hours. Unknown: email at 1 hour, then emails on days 3, 7, 14 and 30, never a retry.</desc><circle cx="34" cy="22" r="8" class="node-accent"/><g class="ln accent" transform="translate(28 16) scale(0.5)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g><text x="48" y="26" class="label-secondary">retry</text><circle cx="112" cy="22" r="8" class="node-info"/><g class="ln info" transform="translate(106 16) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g><text x="126" y="26" class="label-secondary">email</text><circle cx="190" cy="22" r="8" class="node-accent" stroke-dasharray="3 2"/><g class="ln accent" transform="translate(184 16) scale(0.5)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g><text x="204" y="26" class="label-secondary">retry, only after a card update</text><text x="24" y="79" class="header accent">SOFT</text><text x="24" y="95" class="label-secondary">retry, then email</text><path d="M200 82H662" class="lane"/><g data-category="soft"><g data-step="retry_early" data-hours="4"><circle cx="203" cy="82" r="9" class="node-accent"/><g class="ln accent" transform="translate(197 76) scale(0.5)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g><text x="203" y="105" class="label-secondary" text-anchor="middle">4h</text></g><g data-step="email_day1" data-hours="5"><circle cx="225" cy="82" r="9" class="node-info"/><g class="ln info" transform="translate(219 76) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g><text x="225" y="105" class="label-secondary" text-anchor="middle">5h</text></g><g data-step="retry_day2" data-hours="48"><circle cx="338" cy="82" r="9" class="node-accent"/><g class="ln accent" transform="translate(332 76) scale(0.5)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g></g><g data-step="email_day3" data-hours="72"><circle cx="400" cy="82" r="9" class="node-info"/><g class="ln info" transform="translate(394 76) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="email_day7" data-hours="168"><circle cx="462" cy="82" r="9" class="node-info"/><g class="ln info" transform="translate(456 76) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="email_day14" data-hours="336"><circle cx="524" cy="82" r="9" class="node-info"/><g class="ln info" transform="translate(518 76) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="retry_day21" data-hours="504"><circle cx="586" cy="82" r="9" class="node-accent"/><g class="ln accent" transform="translate(580 76) scale(0.5)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g></g><g data-step="email_day30" data-hours="720"><circle cx="648" cy="82" r="9" class="node-info"/><g class="ln info" transform="translate(642 76) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g></g><text x="24" y="133" class="header accent">NETWORK</text><text x="24" y="149" class="label-secondary">two retries, then email</text><path d="M200 136H662" class="lane"/><g data-category="network"><g data-step="retry_4hr" data-hours="4"><circle cx="214" cy="136" r="9" class="node-accent"/><g class="ln accent" transform="translate(208 130) scale(0.5)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g><text x="214" y="159" class="label-secondary" text-anchor="middle">4h</text></g><g data-step="retry_day2" data-hours="24"><circle cx="276" cy="136" r="9" class="node-accent"/><g class="ln accent" transform="translate(270 130) scale(0.5)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g></g><g data-step="email_day3" data-hours="48"><circle cx="338" cy="136" r="9" class="node-info"/><g class="ln info" transform="translate(332 130) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="email_day7" data-hours="168"><circle cx="462" cy="136" r="9" class="node-info"/><g class="ln info" transform="translate(456 130) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="email_day14" data-hours="336"><circle cx="524" cy="136" r="9" class="node-info"/><g class="ln info" transform="translate(518 130) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="retry_day21" data-hours="504"><circle cx="586" cy="136" r="9" class="node-accent"/><g class="ln accent" transform="translate(580 130) scale(0.5)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g></g><g data-step="email_day30" data-hours="720"><circle cx="648" cy="136" r="9" class="node-info"/><g class="ln info" transform="translate(642 130) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g></g><text x="24" y="187" class="header info">EXPIRED</text><text x="24" y="203" class="label-secondary">email the update link</text><path d="M200 190H662" class="lane"/><g data-category="expired"><g data-step="email_day1" data-hours="1"><circle cx="214" cy="190" r="9" class="node-info"/><g class="ln info" transform="translate(208 184) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g><text x="214" y="213" class="label-secondary" text-anchor="middle">1h</text></g><g data-step="email_day3" data-hours="72"><circle cx="400" cy="190" r="9" class="node-info"/><g class="ln info" transform="translate(394 184) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="email_day7" data-hours="168"><circle cx="462" cy="190" r="9" class="node-info"/><g class="ln info" transform="translate(456 184) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="email_day14" data-hours="336"><circle cx="524" cy="190" r="9" class="node-info"/><g class="ln info" transform="translate(518 184) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="retry_day21" data-hours="504"><circle cx="586" cy="190" r="9" class="node-accent" stroke-dasharray="3 2"/><g class="ln accent" transform="translate(580 184) scale(0.5)"><path d="M19 12a7 7 0 1 1-2-4.9"/><path d="M18 3v5h-5"/></g></g><g data-step="email_day30" data-hours="720"><circle cx="648" cy="190" r="9" class="node-info"/><g class="ln info" transform="translate(642 184) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g></g><text x="24" y="241" class="header warning">FRAUD</text><text x="24" y="257" class="label-secondary">email only</text><path d="M200 244H662" class="lane"/><g data-category="fraud"><g data-step="email_day1" data-hours="2"><circle cx="214" cy="244" r="9" class="node-info"/><g class="ln info" transform="translate(208 238) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g><text x="214" y="267" class="label-secondary" text-anchor="middle">2h</text></g><g data-step="email_day3" data-hours="72"><circle cx="400" cy="244" r="9" class="node-info"/><g class="ln info" transform="translate(394 238) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="email_day7" data-hours="168"><circle cx="462" cy="244" r="9" class="node-info"/><g class="ln info" transform="translate(456 238) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="email_day14" data-hours="336"><circle cx="524" cy="244" r="9" class="node-info"/><g class="ln info" transform="translate(518 238) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g><g data-step="email_day30" data-hours="720"><circle cx="648" cy="244" r="9" class="node-info"/><g class="ln info" transform="translate(642 238) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g></g></g><text x="24" y="295" class="header warning">REVOKED</text><text x="24" y="311" class="label-secondary">one email</text><path d="M200 298H662" class="lane"/><g data-category="revoked"><g data-step="email_revoked" data-hours="2"><circle cx="214" cy="298" r="9" class="node-info"/><g class="ln info" transform="translate(208 292) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g><text x="214" y="321" class="label-secondary" text-anchor="middle">2h</text></g></g><text x="24" y="349" class="header">UNKNOWN</text><text x="24" y="365" class="label-secondary">email only</text><path d="M200 352H662" class="lane"/><g data-category="unknown"><g data-step="email_day1" data-hours="1"><circle cx="214" cy="352" r="9" class="node-info"/><g class="ln info" transform="translate(208 346) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 7l10-7"/></g><text x="214" y="375" class="label-secondary" text-anchor="middle">1h</text></g><g data-step="email_day3" data-hours="72"><circle cx="400" cy="352" r="9" class="node-info"/><g class="ln info" transform="translate(394 346) scale(0.5)"><rect x="2" y="5" width="20" height="14" rx="2"/><pat