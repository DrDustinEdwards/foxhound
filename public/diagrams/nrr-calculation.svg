<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260"><title>Net Revenue Retention formula</title><desc>Visual NRR equation with starting MRR, expansion, contraction, and churned blocks adding to ending MRR, then divided by starting MRR to derive the NRR percentage, with worked example.</desc><defs><marker id="arrow-nrr" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" class="arrow-head"/></marker></defs><style>.node-neutral { fill: #e8e6e0; stroke: #b0ada6; }
    .node-accent  { fill: #e8f5f5; stroke: #01585c; }
    .node-success { fill: #e1f5ee; stroke: #1d9e75; }
    .node-warning { fill: #fcebeb; stroke: #a32d2d; }
    .node-info    { fill: #e6f1fb; stroke: #185fa5; }
    .label-primary   { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; font-family: system-ui, sans-serif; }
    .label-accent    { fill: #01585c; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .op { fill: #595c56; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 500; }
    .connector { stroke: #8a8a7e; stroke-width: 1; fill: none; }
    .arrow-head { fill: #8a8a7e; }
    :root[data-theme=&quot;dark&quot;] .node-neutral { fill: #222420; stroke: #4a4c44; }
    :root[data-theme=&quot;dark&quot;] .node-accent  { fill: #1a2d2e; stroke: #2d7c80; }
    :root[data-theme=&quot;dark&quot;] .node-success { fill: #091e14; stroke: #1f7a5f; }
    :root[data-theme=&quot;dark&quot;] .node-warning { fill: #200a0a; stroke: #b92727; }
    :root[data-theme=&quot;dark&quot;] .node-info    { fill: #0a1428; stroke: #315dc4; }
    :root[data-theme=&quot;dark&quot;] .label-primary   { fill: #f0ede8; }
    :root[data-theme=&quot;dark&quot;] .label-secondary { fill: #a8a49e; }
    :root[data-theme=&quot;dark&quot;] .label-accent    { fill: #97c8cb; }
    :root[data-theme=&quot;dark&quot;] .op { fill: #a8a49e; }
    :root[data-theme=&quot;dark&quot;] .connector { stroke: #4a4c44; }
    :root[data-theme=&quot;dark&quot;] .arrow-head { fill: #4a4c44; }</style><text x="40" y="24" class="label-primary">NRR formula</text><rect width="100" height="50" x="40" y="50" class="node-info" rx="6"/><text x="90" y="74" class="label-primary" text-anchor="middle">Starting MRR</text><text x="90" y="90" class="label-secondary" text-anchor="middle">month start</text><text x="153" y="82" class="op" text-anchor="middle">+</text><rect width="100" height="50" x="170" y="50" class="node-success" rx="6"/><text x="220" y="74" class="label-primary" text-anchor="middle">Expansion</text><text x="220" y="90" class="label-secondary" text-anchor="middle">upgrades, addons</text><text x="283" y="82" class="op" text-anchor="middle">-</text><rect width="100" height="50" x="300" y="50" class="node-warning" rx="6"/><text x="350" y="74" class="label-primary" text-anchor="middle">Contraction</text><text x="350" y="90" class="label-secondary" text-anchor="middle">downgrades</text><text x="413" y="82" class="op" text-anchor="middle">-</text><rect width="100" height="50" x="430" y="50" class="node-warning" rx="6"/><text x="480" y="74" class="label-primary" text-anchor="middle">Churned</text><text x="480" y="90" class="label-secondary" text-anchor="middle">cancellations</text><text x="543" y="82" class="op" text-anchor="middle">=</text><rect width="80" height="50" x="560" y="50" class="node-accent" rx="6"/><text x="600" y="74" class="label-accent" text-anchor="middle">Ending</text><text x="600" y="90" class="label-secondary" text-anchor="middle">month close</text><text x="40" y="138" class="label-secondary">Worked example</text><text x="90" y="162" class="label-primary" text-anchor="middle">$500k</text><text x="153" y="162" class="op" text-anchor="middle">+</text><text x="220" y="162" class="label-primary" text-anchor="middle">$75k</text><text x="283" y="162" class="op" text-anchor="middle">-</text><text x="350" y="162" class="label-primary" text-anchor="middle">$20k</text><text x="413" y="162" class="op" text-anchor="middle">-</text><text x="480" y="162" class="label-primary" text-anchor="middle">$30k</text><text x="543" y="162" class="op" text-anchor="middle">=</text><text x="600" y="162" class="label-accent" text-anchor="middle">$525k</text><path marker-end="url(#arrow-nrr)" d="M600 172v28" class="connector"/><text x="450" y="200" class="label-secondary" text-anchor="end">Ending $525k ÷ Starting $500k =</text><rect width="180" height="36" x="460" y="210" class="node-accent" rx="6"/><text x="550" y="234" class="label-accent" text-anchor="middle">NRR = 105%</text></svg>