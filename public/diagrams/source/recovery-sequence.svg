<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820" role="img">
  <title>Stripe failed-payment recovery sequence by decline category</title>
  <desc>Full recovery flowchart starting from the invoice.payment_failed webhook, classifying the decline code into soft, card data, or hard categories, walking through each category's day-by-day retry and email schedule, and terminating in a recovered or cancelled outcome.</desc>
  <defs>
    <marker id="arrow-rs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-head"/>
    </marker>
  </defs>
  <style>
    .node-neutral { fill: #e8e6e0; stroke: #b0ada6; }
    .node-accent  { fill: #faeeda; stroke: #d4941a; }
    .node-success { fill: #e1f5ee; stroke: #1d9e75; }
    .node-warning { fill: #fcebeb; stroke: #a32d2d; }
    .node-info    { fill: #e6f1fb; stroke: #185fa5; }
    .label-primary   { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; font-family: system-ui, sans-serif; }
    .label-mono      { fill: #1a1c18; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 500; }
    .header          { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .connector { stroke: #8a8a7e; stroke-width: 1; fill: none; }
    .arrow-head { fill: #8a8a7e; }
    :root[data-theme="dark"] .node-neutral { fill: #222420; stroke: #4a4c44; }
    :root[data-theme="dark"] .node-accent  { fill: #1e1a0a; stroke: #826217; }
    :root[data-theme="dark"] .node-success { fill: #091e14; stroke: #1f7a5f; }
    :root[data-theme="dark"] .node-warning { fill: #200a0a; stroke: #b92727; }
    :root[data-theme="dark"] .node-info    { fill: #0a1428; stroke: #315dc4; }
    :root[data-theme="dark"] .label-primary   { fill: #f0ede8; }
    :root[data-theme="dark"] .label-secondary { fill: #a8a49e; }
    :root[data-theme="dark"] .label-mono      { fill: #f0ede8; }
    :root[data-theme="dark"] .header          { fill: #f0ede8; }
    :root[data-theme="dark"] .connector { stroke: #4a4c44; }
    :root[data-theme="dark"] .arrow-head { fill: #4a4c44; }
  </style>

  <!-- TOP: Webhook -->
  <rect class="node-accent" x="220" y="20" width="240" height="56" rx="8"/>
  <text class="label-primary" x="340" y="46" text-anchor="middle">Stripe webhook fires</text>
  <text class="label-mono" x="340" y="64" text-anchor="middle">invoice.payment_failed</text>

  <line class="connector" x1="340" y1="76" x2="340" y2="106" marker-end="url(#arrow-rs)"/>

  <!-- Classify -->
  <rect class="node-neutral" x="220" y="106" width="240" height="56" rx="8"/>
  <text class="label-primary" x="340" y="132" text-anchor="middle">Classify decline_code</text>
  <text class="label-secondary" x="340" y="150" text-anchor="middle">soft / card data / hard</text>

  <!-- Branching -->
  <line class="connector" x1="340" y1="162" x2="340" y2="186"/>
  <line class="connector" x1="123" y1="186" x2="557" y2="186"/>
  <line class="connector" x1="123" y1="186" x2="123" y2="206" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="340" y1="186" x2="340" y2="206" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="557" y1="186" x2="557" y2="206" marker-end="url(#arrow-rs)"/>

  <!-- Column headers (y=206 to y=256) -->
  <rect class="node-info" x="53" y="206" width="140" height="50" rx="8"/>
  <text class="header" x="123" y="228" text-anchor="middle">SOFT</text>
  <text class="label-secondary" x="123" y="246" text-anchor="middle">silent retry first</text>

  <rect class="node-success" x="270" y="206" width="140" height="50" rx="8"/>
  <text class="header" x="340" y="228" text-anchor="middle">CARD DATA</text>
  <text class="label-secondary" x="340" y="246" text-anchor="middle">email + update link</text>

  <rect class="node-warning" x="487" y="206" width="140" height="50" rx="8"/>
  <text class="header" x="557" y="228" text-anchor="middle">HARD</text>
  <text class="label-secondary" x="557" y="246" text-anchor="middle">no retry, fast email</text>

  <!-- Connectors from headers down -->
  <line class="connector" x1="123" y1="256" x2="123" y2="280" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="340" y1="256" x2="340" y2="280" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="557" y1="256" x2="557" y2="280" marker-end="url(#arrow-rs)"/>

  <!-- SOFT column events (6 rows, y=280 to y=700) -->
  <rect class="node-neutral" x="53" y="280" width="140" height="50" rx="6"/>
  <text class="label-mono" x="63" y="300">D1</text>
  <text class="label-primary" x="123" y="306" text-anchor="middle">Silent retry</text>
  <text class="label-secondary" x="123" y="322" text-anchor="middle">+ email if it fails</text>

  <rect class="node-neutral" x="53" y="350" width="140" height="50" rx="6"/>
  <text class="label-mono" x="63" y="370">D3</text>
  <text class="label-primary" x="123" y="376" text-anchor="middle">Retry</text>
  <text class="label-secondary" x="123" y="392" text-anchor="middle">no email</text>

  <rect class="node-neutral" x="53" y="420" width="140" height="50" rx="6"/>
  <text class="label-mono" x="63" y="440">D5</text>
  <text class="label-primary" x="123" y="446" text-anchor="middle">Retry + email</text>
  <text class="label-secondary" x="123" y="462" text-anchor="middle">friendly nudge</text>

  <rect class="node-neutral" x="53" y="490" width="140" height="50" rx="6"/>
  <text class="label-mono" x="63" y="510">D8</text>
  <text class="label-primary" x="123" y="516" text-anchor="middle">Retry</text>
  <text class="label-secondary" x="123" y="532" text-anchor="middle">silent</text>

  <rect class="node-neutral" x="53" y="560" width="140" height="50" rx="6"/>
  <text class="label-mono" x="63" y="580">D11</text>
  <text class="label-primary" x="123" y="586" text-anchor="middle">Retry + email</text>
  <text class="label-secondary" x="123" y="602" text-anchor="middle">urgency</text>

  <rect class="node-neutral" x="53" y="630" width="140" height="50" rx="6"/>
  <text class="label-mono" x="63" y="650">D14</text>
  <text class="label-primary" x="123" y="656" text-anchor="middle">Final retry</text>
  <text class="label-secondary" x="123" y="672" text-anchor="middle">last chance email</text>

  <!-- Soft column connectors -->
  <line class="connector" x1="123" y1="330" x2="123" y2="350" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="123" y1="400" x2="123" y2="420" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="123" y1="470" x2="123" y2="490" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="123" y1="540" x2="123" y2="560" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="123" y1="610" x2="123" y2="630" marker-end="url(#arrow-rs)"/>

  <!-- CARD DATA column events (3 rows, y=280 to y=420) -->
  <rect class="node-neutral" x="270" y="280" width="140" height="50" rx="6"/>
  <text class="label-mono" x="280" y="300">D0</text>
  <text class="label-primary" x="340" y="306" text-anchor="middle">Email customer</text>
  <text class="label-secondary" x="340" y="322" text-anchor="middle">payment update link</text>

  <rect class="node-neutral" x="270" y="350" width="140" height="50" rx="6"/>
  <text class="label-mono" x="280" y="370">D3</text>
  <text class="label-primary" x="340" y="376" text-anchor="middle">Retry + email</text>
  <text class="label-secondary" x="340" y="392" text-anchor="middle">reminder</text>

  <rect class="node-neutral" x="270" y="420" width="140" height="50" rx="6"/>
  <text class="label-mono" x="280" y="440">D7</text>
  <text class="label-primary" x="340" y="446" text-anchor="middle">Retry</text>
  <text class="label-secondary" x="340" y="462" text-anchor="middle">after card likely updated</text>

  <!-- Card data column connectors -->
  <line class="connector" x1="340" y1="330" x2="340" y2="350" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="340" y1="400" x2="340" y2="420" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="340" y1="470" x2="340" y2="720" stroke-dasharray="4 4"/>

  <!-- HARD column events (2 rows, y=280 to y=350) -->
  <rect class="node-neutral" x="487" y="280" width="140" height="50" rx="6"/>
  <text class="label-mono" x="497" y="300">D0</text>
  <text class="label-primary" x="557" y="306" text-anchor="middle">Email customer</text>
  <text class="label-secondary" x="557" y="322" text-anchor="middle">update payment method</text>

  <rect class="node-neutral" x="487" y="350" width="140" height="50" rx="6"/>
  <text class="label-mono" x="497" y="370">D3</text>
  <text class="label-primary" x="557" y="376" text-anchor="middle">Final notice email</text>
  <text class="label-secondary" x="557" y="392" text-anchor="middle">no further retries</text>

  <!-- Hard column connector -->
  <line class="connector" x1="557" y1="330" x2="557" y2="350" marker-end="url(#arrow-rs)"/>
  <line class="connector" x1="557" y1="400" x2="557" y2="720" stroke-dasharray="4 4"/>

  <!-- Soft column connector to outcome -->
  <line class="connector" x1="123" y1="680" x2="123" y2="720" stroke-dasharray="4 4"/>

  <!-- OUTCOMES (y=720 to y=790) -->
  <rect class="node-success" x="53" y="720" width="280" height="70" rx="10"/>
  <text class="header" x="193" y="748" text-anchor="middle">RECOVERED</text>
  <text class="label-secondary" x="193" y="766" text-anchor="middle">retry succeeds or customer updates card</text>
  <text class="label-secondary" x="193" y="782" text-anchor="middle">pending emails cancel automatically</text>

  <rect class="node-warning" x="347" y="720" width="280" height="70" rx="10"/>
  <text class="header" x="487" y="748" text-anchor="middle">CANCELLED</text>
  <text class="label-secondary" x="487" y="766" text-anchor="middle">no recovery after 30 days</text>
  <text class="label-secondary" x="487" y="782" text-anchor="middle">subscription cancels, win-back queued</text>
</svg>
