<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img">
  <title>Dunning sequence timeline by decline category</title>
  <desc>Three horizontal timelines spanning day 0 through day 14, one per decline category (soft, hard, card data), showing when retries and emails fire relative to each other on a shared day axis.</desc>
  <style>
    .lane { fill: none; stroke: #cccbc3; stroke-width: 1; stroke-dasharray: 2 4; }
    .lane-label-soft  { fill: #185fa5; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .lane-label-hard  { fill: #a32d2d; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .lane-label-card  { fill: #1d9e75; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .event-retry { fill: #faeeda; stroke: #d4941a; }
    .event-email { fill: #e6f1fb; stroke: #185fa5; }
    .event-letter { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; }
    .axis-tick { stroke: #b0ada6; stroke-width: 1; }
    .axis-line { stroke: #b0ada6; stroke-width: 1; }
    :root[data-theme="dark"] .lane { stroke: #2e3028; }
    :root[data-theme="dark"] .lane-label-soft  { fill: #6c93ef; }
    :root[data-theme="dark"] .lane-label-hard  { fill: #db5757; }
    :root[data-theme="dark"] .lane-label-card  { fill: #3ecf8e; }
    :root[data-theme="dark"] .event-retry { fill: #1e1a0a; stroke: #826217; }
    :root[data-theme="dark"] .event-email { fill: #0a1428; stroke: #315dc4; }
    :root[data-theme="dark"] .event-letter { fill: #f0ede8; }
    :root[data-theme="dark"] .label-secondary { fill: #a8a49e; }
    :root[data-theme="dark"] .axis-tick { stroke: #4a4c44; }
    :root[data-theme="dark"] .axis-line { stroke: #4a4c44; }
  </style>

  <!-- Legend -->
  <circle class="event-retry" cx="60" cy="22" r="8"/>
  <text class="event-letter" x="60" y="26" text-anchor="middle">R</text>
  <text class="label-secondary" x="74" y="26">retry</text>
  <circle class="event-email" cx="140" cy="22" r="8"/>
  <text class="event-letter" x="140" y="26" text-anchor="middle">E</text>
  <text class="label-secondary" x="154" y="26">email</text>

  <!-- Soft lane (y=70 to y=110) -->
  <text class="lane-label-soft" x="40" y="80">SOFT</text>
  <text class="label-secondary" x="40" y="96">silent retry first</text>
  <line class="lane" x1="140" y1="90" x2="640" y2="90"/>
  <!-- D1 R+E, D3 R, D5 R+E, D8 R, D11 R+E, D14 R -->
  <circle class="event-retry" cx="170" cy="90" r="9"/><text class="event-letter" x="170" y="94" text-anchor="middle">R</text>
  <circle class="event-email" cx="190" cy="90" r="9"/><text class="event-letter" x="190" y="94" text-anchor="middle">E</text>
  <circle class="event-retry" cx="240" cy="90" r="9"/><text class="event-letter" x="240" y="94" text-anchor="middle">R</text>
  <circle class="event-retry" cx="310" cy="90" r="9"/><text class="event-letter" x="310" y="94" text-anchor="middle">R</text>
  <circle class="event-email" cx="330" cy="90" r="9"/><text class="event-letter" x="330" y="94" text-anchor="middle">E</text>
  <circle class="event-retry" cx="420" cy="90" r="9"/><text class="event-letter" x="420" y="94" text-anchor="middle">R</text>
  <circle class="event-retry" cx="530" cy="90" r="9"/><text class="event-letter" x="530" y="94" text-anchor="middle">R</text>
  <circle class="event-email" cx="550" cy="90" r="9"/><text class="event-letter" x="550" y="94" text-anchor="middle">E</text>
  <circle class="event-retry" cx="630" cy="90" r="9"/><text class="event-letter" x="630" y="94" text-anchor="middle">R</text>

  <!-- Hard lane (y=140 to y=180) -->
  <text class="lane-label-hard" x="40" y="150">HARD</text>
  <text class="label-secondary" x="40" y="166">no retry, email day 0</text>
  <line class="lane" x1="140" y1="160" x2="640" y2="160"/>
  <circle class="event-email" cx="150" cy="160" r="9"/><text class="event-letter" x="150" y="164" text-anchor="middle">E</text>
  <circle class="event-email" cx="240" cy="160" r="9"/><text class="event-letter" x="240" y="164" text-anchor="middle">E</text>

  <!-- Card data lane (y=210 to y=250) -->
  <text class="lane-label-card" x="40" y="220">CARD DATA</text>
  <text class="label-secondary" x="40" y="236">email + update link</text>
  <line class="lane" x1="140" y1="230" x2="640" y2="230"/>
  <circle class="event-email" cx="150" cy="230" r="9"/><text class="event-letter" x="150" y="234" text-anchor="middle">E</text>
  <circle class="event-retry" cx="240" cy="230" r="9"/><text class="event-letter" x="240" y="234" text-anchor="middle">R</text>
  <circle class="event-email" cx="260" cy="230" r="9"/><text class="event-letter" x="260" y="234" text-anchor="middle">E</text>
  <circle class="event-retry" cx="380" cy="230" r="9"/><text class="event-letter" x="380" y="234" text-anchor="middle">R</text>

  <!-- Day axis (y=290) -->
  <line class="axis-line" x1="140" y1="290" x2="640" y2="290"/>
  <line class="axis-tick" x1="150" y1="286" x2="150" y2="294"/>
  <line class="axis-tick" x1="240" y1="286" x2="240" y2="294"/>
  <line class="axis-tick" x1="310" y1="286" x2="310" y2="294"/>
  <line class="axis-tick" x1="380" y1="286" x2="380" y2="294"/>
  <line class="axis-tick" x1="420" y1="286" x2="420" y2="294"/>
  <line class="axis-tick" x1="530" y1="286" x2="530" y2="294"/>
  <line class="axis-tick" x1="630" y1="286" x2="630" y2="294"/>
  <text class="label-secondary" x="150" y="308" text-anchor="middle">D0</text>
  <text class="label-secondary" x="170" y="308" text-anchor="middle">D1</text>
  <text class="label-secondary" x="240" y="308" text-anchor="middle">D3</text>
  <text class="label-secondary" x="310" y="308" text-anchor="middle">D5</text>
  <text class="label-secondary" x="380" y="308" text-anchor="middle">D7</text>
  <text class="label-secondary" x="420" y="308" text-anchor="middle">D8</text>
  <text class="label-secondary" x="530" y="308" text-anchor="middle">D11</text>
  <text class="label-secondary" x="630" y="308" text-anchor="middle">D14</text>
</svg>
