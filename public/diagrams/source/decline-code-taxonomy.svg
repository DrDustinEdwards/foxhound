<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img">
  <title>Stripe decline code taxonomy</title>
  <desc>Four-category classification tree branching from a central decline_code received node into soft, card data, hard, and restriction categories, each showing the recovery action and four representative example codes.</desc>
  <defs>
    <marker id="arrow-dct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-head"/>
    </marker>
  </defs>
  <style>
    .node-neutral { fill: #e8e6e0; stroke: #b0ada6; }
    .node-accent  { fill: #e8f5f5; stroke: #01585c; }
    .node-success { fill: #e1f5ee; stroke: #1d9e75; }
    .node-warning { fill: #fcebeb; stroke: #a32d2d; }
    .node-info    { fill: #e6f1fb; stroke: #185fa5; }
    .label-primary   { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; font-family: system-ui, sans-serif; }
    .label-mono      { fill: #1a1c18; font-family: ui-monospace, monospace; font-size: 11px; }
    .header          { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .connector { stroke: #8a8a7e; stroke-width: 1; fill: none; }
    .arrow-head { fill: #8a8a7e; }
    :root[data-theme="dark"] .node-neutral { fill: #222420; stroke: #4a4c44; }
    :root[data-theme="dark"] .node-accent  { fill: #1a2d2e; stroke: #2d7c80; }
    :root[data-theme="dark"] .node-success { fill: #091e14; stroke: #1f7a5f; }
    :root[data-theme="dark"] .node-warning { fill: #200a0a; stroke: #b92727; }
    :root[data-theme="dark"] .node-info    { fill: #0a1428; stroke: #315dc4; }
    :root[data-theme="dark"] .label-primary   { fill: #f0ede8; }
    :root[data-theme="dark"] .label-secondary { fill: #a8a49e; }
    :root[data-theme="dark"] .label-mono      { fill: #f0ede8; }
    :root[data-theme="dark"] .header          { fill: #f0ede8; }
    :root[data-theme="dark"] .connector { stroke: #4a4c44; }
    :root[data-theme="dark"] .arrow-head { fill: #4a4c44; }
  </style>

  <!-- Root node -->
  <rect class="node-accent" x="220" y="20" width="240" height="50" rx="8"/>
  <text class="label-primary" x="340" y="44" text-anchor="middle">decline_code received</text>
  <text class="label-secondary" x="340" y="60" text-anchor="middle">via Stripe webhook</text>

  <!-- Branching connectors to 4 children -->
  <line class="connector" x1="340" y1="70" x2="340" y2="100"/>
  <line class="connector" x1="123" y1="100" x2="557" y2="100"/>
  <line class="connector" x1="123" y1="100" x2="123" y2="120" marker-end="url(#arrow-dct)"/>
  <line class="connector" x1="268" y1="100" x2="268" y2="120" marker-end="url(#arrow-dct)"/>
  <line class="connector" x1="413" y1="100" x2="413" y2="120" marker-end="url(#arrow-dct)"/>
  <line class="connector" x1="557" y1="100" x2="557" y2="120" marker-end="url(#arrow-dct)"/>

  <!-- Category 1: Soft -->
  <rect class="node-info" x="53" y="125" width="140" height="245" rx="8"/>
  <text class="header" x="123" y="148" text-anchor="middle">SOFT</text>
  <text class="label-secondary" x="123" y="166" text-anchor="middle">retry first</text>
  <line class="connector" x1="65" y1="180" x2="181" y2="180"/>
  <text class="label-mono" x="63" y="204">insufficient_funds</text>
  <text class="label-mono" x="63" y="226">generic_decline</text>
  <text class="label-mono" x="63" y="248">do_not_honor</text>
  <text class="label-mono" x="63" y="270">processing_error</text>
  <text class="label-secondary" x="123" y="320" text-anchor="middle">temporary</text>
  <text class="label-secondary" x="123" y="336" text-anchor="middle">issuer condition</text>

  <!-- Category 2: Card data -->
  <rect class="node-success" x="198" y="125" width="140" height="245" rx="8"/>
  <text class="header" x="268" y="148" text-anchor="middle">CARD DATA</text>
  <text class="label-secondary" x="268" y="166" text-anchor="middle">email day 1, no retry</text>
  <line class="connector" x1="210" y1="180" x2="326" y2="180"/>
  <text class="label-mono" x="208" y="204">expired_card</text>
  <text class="label-mono" x="208" y="226">incorrect_cvc</text>
  <text class="label-mono" x="208" y="248">incorrect_zip</text>
  <text class="label-mono" x="208" y="270">incorrect_number</text>
  <text class="label-secondary" x="268" y="320" text-anchor="middle">customer must</text>
  <text class="label-secondary" x="268" y="336" text-anchor="middle">update card</text>

  <!-- Category 3: Hard -->
  <rect class="node-warning" x="343" y="125" width="140" height="245" rx="8"/>
  <text class="header" x="413" y="148" text-anchor="middle">HARD</text>
  <text class="label-secondary" x="413" y="166" text-anchor="middle">no retry, email day 0</text>
  <line class="connector" x1="355" y1="180" x2="471" y2="180"/>
  <text class="label-mono" x="353" y="204">lost_card</text>
  <text class="label-mono" x="353" y="226">stolen_card</text>
  <text class="label-mono" x="353" y="248">fraudulent</text>
  <text class="label-mono" x="353" y="270">do_not_try_again</text>
  <text class="label-secondary" x="413" y="320" text-anchor="middle">issuer has said</text>
  <text class="label-secondary" x="413" y="336" text-anchor="middle">stop trying</text>

  <!-- Category 4: Restriction -->
  <rect class="node-neutral" x="487" y="125" width="140" height="245" rx="8"/>
  <text class="header" x="557" y="148" text-anchor="middle">RESTRICTION</text>
  <text class="label-secondary" x="557" y="166" text-anchor="middle">email + call issuer</text>
  <line class="connector" x1="499" y1="180" x2="615" y2="180"/>
  <text class="label-mono" x="497" y="204">call_issuer</text>
  <text class="label-mono" x="497" y="226">transaction_not_allowed</text>
  <text class="label-mono" x="497" y="248">card_velocity_exceeded</text>
  <text class="label-mono" x="497" y="270">revocation_of_authorization</text>
  <text class="label-secondary" x="557" y="320" text-anchor="middle">restriction on</text>
  <text class="label-secondary" x="557" y="336" text-anchor="middle">the card or account</text>
</svg>
