<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img">
  <title>Stripe dispute lifecycle</title>
  <desc>Five-stage horizontal timeline of a Stripe dispute, from the cardholder contacting their bank through funds being frozen, notification, the evidence window, and the issuer's final decision.</desc>
  <defs>
    <marker id="arrow-dl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-head"/>
    </marker>
  </defs>
  <style>
    .node-neutral { fill: #e8e6e0; stroke: #b0ada6; }
    .node-accent  { fill: #faeeda; stroke: #d4941a; }
    .node-warning { fill: #fcebeb; stroke: #a32d2d; }
    .node-info    { fill: #e6f1fb; stroke: #185fa5; }
    .label-primary   { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; font-family: system-ui, sans-serif; }
    .label-warning   { fill: #a32d2d; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    .connector { stroke: #8a8a7e; stroke-width: 1; fill: none; }
    .arrow-head { fill: #8a8a7e; }
    :root[data-theme="dark"] .node-neutral { fill: #222420; stroke: #4a4c44; }
    :root[data-theme="dark"] .node-accent  { fill: #1e1a0a; stroke: #826217; }
    :root[data-theme="dark"] .node-warning { fill: #200a0a; stroke: #b92727; }
    :root[data-theme="dark"] .node-info    { fill: #0a1428; stroke: #315dc4; }
    :root[data-theme="dark"] .label-primary   { fill: #f0ede8; }
    :root[data-theme="dark"] .label-secondary { fill: #a8a49e; }
    :root[data-theme="dark"] .label-warning   { fill: #db5757; }
    :root[data-theme="dark"] .connector { stroke: #4a4c44; }
    :root[data-theme="dark"] .arrow-head { fill: #4a4c44; }
  </style>

  <!-- Stage boxes -->
  <rect class="node-neutral" x="50" y="40" width="100" height="64" rx="8"/>
  <text class="label-primary" x="100" y="64" text-anchor="middle">Stage 1</text>
  <text class="label-secondary" x="100" y="82" text-anchor="middle">Cardholder</text>
  <text class="label-secondary" x="100" y="96" text-anchor="middle">contacts bank</text>

  <rect class="node-warning" x="170" y="40" width="100" height="64" rx="8"/>
  <text class="label-primary" x="220" y="64" text-anchor="middle">Stage 2</text>
  <text class="label-secondary" x="220" y="82" text-anchor="middle">Funds frozen</text>
  <text class="label-secondary" x="220" y="96" text-anchor="middle">automatically</text>

  <rect class="node-info" x="290" y="40" width="100" height="64" rx="8"/>
  <text class="label-primary" x="340" y="64" text-anchor="middle">Stage 3</text>
  <text class="label-secondary" x="340" y="82" text-anchor="middle">Webhook +</text>
  <text class="label-secondary" x="340" y="96" text-anchor="middle">notification</text>

  <rect class="node-accent" x="410" y="40" width="100" height="64" rx="8"/>
  <text class="label-primary" x="460" y="64" text-anchor="middle">Stage 4</text>
  <text class="label-secondary" x="460" y="82" text-anchor="middle">Evidence</text>
  <text class="label-secondary" x="460" y="96" text-anchor="middle">window</text>

  <rect class="node-neutral" x="530" y="40" width="100" height="64" rx="8"/>
  <text class="label-primary" x="580" y="64" text-anchor="middle">Stage 5</text>
  <text class="label-secondary" x="580" y="82" text-anchor="middle">Issuer</text>
  <text class="label-secondary" x="580" y="96" text-anchor="middle">decides</text>

  <!-- Arrows between stages -->
  <line class="connector" x1="150" y1="72" x2="170" y2="72" marker-end="url(#arrow-dl)"/>
  <line class="connector" x1="270" y1="72" x2="290" y2="72" marker-end="url(#arrow-dl)"/>
  <line class="connector" x1="390" y1="72" x2="410" y2="72" marker-end="url(#arrow-dl)"/>
  <line class="connector" x1="510" y1="72" x2="530" y2="72" marker-end="url(#arrow-dl)"/>

  <!-- Time axis -->
  <line class="connector" x1="50" y1="140" x2="630" y2="140"/>
  <text class="label-secondary" x="100" y="158" text-anchor="middle">Day 0</text>
  <text class="label-secondary" x="220" y="158" text-anchor="middle">Instant</text>
  <text class="label-secondary" x="340" y="158" text-anchor="middle">Hours</text>
  <text class="label-secondary" x="460" y="158" text-anchor="middle">7-21 days</text>
  <text class="label-secondary" x="580" y="158" text-anchor="middle">60-90 days</text>

  <!-- Hard deadline marker on evidence window -->
  <text class="label-warning" x="460" y="184" text-anchor="middle">Hard deadline</text>
  <text class="label-secondary" x="460" y="200" text-anchor="middle">Miss it and the dispute is lost</text>
</svg>
