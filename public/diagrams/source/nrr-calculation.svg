<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img">
  <title>Net Revenue Retention formula</title>
  <desc>Visual NRR equation with starting MRR, expansion, contraction, and churned blocks adding to ending MRR, then divided by starting MRR to derive the NRR percentage, with worked example.</desc>
  <defs>
    <marker id="arrow-nrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow-head"/>
    </marker>
  </defs>
  <style>
    .node-neutral { fill: #e8e6e0; stroke: #b0ada6; }
    .node-accent  { fill: #e8f5f5; stroke: #01585c; }
    .node-success { fill: #e1f5ee; stroke: #1d9e75; }
    .node-warning { fill: #fcebeb; stroke: #a32d2d; }
    .node-info    { fill: #e6f1fb; stroke: #185fa5; }
    .label-primary   { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; font-family: system-ui, sans-serif; }
    .label-accent    { fill: #01585c; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .op { fill: #595c56; font-family: system-ui, sans-serif; font-size: 16px; font-weight: 500; }
    .connector { stroke: #8a8a7e; stroke-width: 1; fill: none; }
    .arrow-head { fill: #8a8a7e; }
    :root[data-theme="dark"] .node-neutral { fill: #222420; stroke: #4a4c44; }
    :root[data-theme="dark"] .node-accent  { fill: #1a2d2e; stroke: #2d7c80; }
    :root[data-theme="dark"] .node-success { fill: #091e14; stroke: #1f7a5f; }
    :root[data-theme="dark"] .node-warning { fill: #200a0a; stroke: #b92727; }
    :root[data-theme="dark"] .node-info    { fill: #0a1428; stroke: #315dc4; }
    :root[data-theme="dark"] .label-primary   { fill: #f0ede8; }
    :root[data-theme="dark"] .label-secondary { fill: #a8a49e; }
    :root[data-theme="dark"] .label-accent    { fill: #97c8cb; }
    :root[data-theme="dark"] .op { fill: #a8a49e; }
    :root[data-theme="dark"] .connector { stroke: #4a4c44; }
    :root[data-theme="dark"] .arrow-head { fill: #4a4c44; }
  </style>

  <!-- Title -->
  <text class="label-primary" x="40" y="24">NRR formula</text>

  <!-- Formula blocks (top row) -->
  <rect class="node-info" x="40" y="50" width="100" height="50" rx="6"/>
  <text class="label-primary" x="90" y="74" text-anchor="middle">Starting MRR</text>
  <text class="label-secondary" x="90" y="90" text-anchor="middle">month start</text>
  <text class="op" x="153" y="82" text-anchor="middle">+</text>

  <rect class="node-success" x="170" y="50" width="100" height="50" rx="6"/>
  <text class="label-primary" x="220" y="74" text-anchor="middle">Expansion</text>
  <text class="label-secondary" x="220" y="90" text-anchor="middle">upgrades, addons</text>
  <text class="op" x="283" y="82" text-anchor="middle">-</text>

  <rect class="node-warning" x="300" y="50" width="100" height="50" rx="6"/>
  <text class="label-primary" x="350" y="74" text-anchor="middle">Contraction</text>
  <text class="label-secondary" x="350" y="90" text-anchor="middle">downgrades</text>
  <text class="op" x="413" y="82" text-anchor="middle">-</text>

  <rect class="node-warning" x="430" y="50" width="100" height="50" rx="6"/>
  <text class="label-primary" x="480" y="74" text-anchor="middle">Churned</text>
  <text class="label-secondary" x="480" y="90" text-anchor="middle">cancellations</text>
  <text class="op" x="543" y="82" text-anchor="middle">=</text>

  <rect class="node-accent" x="560" y="50" width="80" height="50" rx="6"/>
  <text class="label-accent" x="600" y="74" text-anchor="middle">Ending</text>
  <text class="label-secondary" x="600" y="90" text-anchor="middle">month close</text>

  <!-- Example row -->
  <text class="label-secondary" x="40" y="138">Worked example</text>
  <text class="label-primary" x="90" y="162" text-anchor="middle">$500k</text>
  <text class="op" x="153" y="162" text-anchor="middle">+</text>
  <text class="label-primary" x="220" y="162" text-anchor="middle">$75k</text>
  <text class="op" x="283" y="162" text-anchor="middle">-</text>
  <text class="label-primary" x="350" y="162" text-anchor="middle">$20k</text>
  <text class="op" x="413" y="162" text-anchor="middle">-</text>
  <text class="label-primary" x="480" y="162" text-anchor="middle">$30k</text>
  <text class="op" x="543" y="162" text-anchor="middle">=</text>
  <text class="label-accent" x="600" y="162" text-anchor="middle">$525k</text>

  <!-- Division arrow and result -->
  <line class="connector" x1="600" y1="172" x2="600" y2="200" marker-end="url(#arrow-nrr)"/>
  <text class="label-secondary" x="450" y="200" text-anchor="end">Ending $525k ÷ Starting $500k =</text>
  <rect class="node-accent" x="460" y="210" width="180" height="36" rx="6"/>
  <text class="label-accent" x="550" y="234" text-anchor="middle">NRR = 105%</text>
</svg>
