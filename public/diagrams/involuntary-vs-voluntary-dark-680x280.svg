<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280"><title>Involuntary vs voluntary churn comparison</title><desc>Side-by-side comparison of involuntary churn (caused by payment failure with intent to stay) and voluntary churn (caused by customer decision to leave), each showing cause, customer intent, intervention, and tool.</desc><style>.node-warning { fill: #fcebeb; stroke: #a32d2d; }
    .node-info    { fill: #e6f1fb; stroke: #185fa5; }
    .node-neutral { fill: #e8e6e0; stroke: #b0ada6; }
    .label-primary   { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; font-family: system-ui, sans-serif; }
    .header-warning  { fill: #a32d2d; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; }
    .header-info     { fill: #185fa5; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; }
    .divider { stroke: #cccbc3; stroke-width: 1; fill: none; }
    :root:not([data-theme=&quot;light&quot;]) .node-warning { fill: #200a0a; stroke: #b92727; }
    :root:not([data-theme=&quot;light&quot;]) .node-info    { fill: #0a1428; stroke: #315dc4; }
    :root:not([data-theme=&quot;light&quot;]) .node-neutral { fill: #222420; stroke: #4a4c44; }
    :root:not([data-theme=&quot;light&quot;]) .label-primary   { fill: #f0ede8; }
    :root:not([data-theme=&quot;light&quot;]) .label-secondary { fill: #a8a49e; }
    :root:not([data-theme=&quot;light&quot;]) .header-warning  { fill: #db5757; }
    :root:not([data-theme=&quot;light&quot;]) .header-info     { fill: #6c93ef; }
    :root:not([data-theme=&quot;light&quot;]) .divider { stroke: #2e3028; }</style><rect width="280" height="240" x="40" y="20" class="node-warning" rx="10"/><text x="180" y="50" class="header-warning" text-anchor="middle">INVOLUNTARY</text><text x="180" y="68" class="label-secondary" text-anchor="middle">they want to stay but the bill won&apos;t go through</text><path d="M60 84h240" class="divider"/><text x="60" y="110" class="label-secondary">Cause</text><text x="60" y="128" class="label-primary">Payment failure</text><text x="60" y="156" class="label-secondary">Customer intent</text><text x="60" y="174" class="label-primary">Stay subscribed</text><text x="60" y="202" class="label-secondary">Intervention</text><text x="60" y="220" class="label-primary">Recovery system</text><text x="60" y="246" class="label-secondary">Tool</text><text x="60" y="264" class="label-primary">Dunning sequence</text><rect width="280" height="240" x="360" y="20" class="node-info" rx="10"/><text x="500" y="50" class="header-info" text-anchor="middle">VOLUNTARY</text><text x="500" y="68" class="label-secondary" text-anchor="middle">they decided to leave and clicked cancel</text><path d="M380 84h240" class="divider"/><text x="380" y="110" class="label-secondary">Cause</text><text x="380" y="128" class="label-primary">Customer decision</text><text x="380" y="156" class="label-secondary">Customer intent</text><text x="380" y="174" class="label-primary">Leave</text><text x="380" y="202" class="label-secondary">Intervention</text><text x="380" y="220" class="label-primary">Product, pricing, CS</text><text x="380" y="246" class="label-secondary">Tool</text><text x="380" y="264" class="label-primary">Cancel flow + customer success</text></svg>