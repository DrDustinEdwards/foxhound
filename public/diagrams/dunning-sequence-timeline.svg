<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340"><title>Dunning sequence timeline by decline category</title><desc>Three horizontal timelines spanning day 0 through day 14, one per decline category (soft, hard, card data), showing when retries and emails fire relative to each other on a shared day axis.</desc><style>.lane { fill: none; stroke: #cccbc3; stroke-width: 1; stroke-dasharray: 2 4; }
    .lane-label-soft  { fill: #185fa5; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .lane-label-hard  { fill: #a32d2d; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .lane-label-card  { fill: #1d9e75; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .event-retry { fill: #faeeda; stroke: #d4941a; }
    .event-email { fill: #e6f1fb; stroke: #185fa5; }
    .event-letter { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; }
    .axis-tick { stroke: #b0ada6; stroke-width: 1; }
    .axis-line { stroke: #b0ada6; stroke-width: 1; }
    :root[data-theme=&quot;dark&quot;] .lane { stroke: #2e3028; }
    :root[data-theme=&quot;dark&quot;] .lane-label-soft  { fill: #6c93ef; }
    :root[data-theme=&quot;dark&quot;] .lane-label-hard  { fill: #db5757; }
    :root[data-theme=&quot;dark&quot;] .lane-label-card  { fill: #3ecf8e; }
    :root[data-theme=&quot;dark&quot;] .event-retry { fill: #1e1a0a; stroke: #826217; }
    :root[data-theme=&quot;dark&quot;] .event-email { fill: #0a1428; stroke: #315dc4; }
    :root[data-theme=&quot;dark&quot;] .event-letter { fill: #f0ede8; }
    :root[data-theme=&quot;dark&quot;] .label-secondary { fill: #a8a49e; }
    :root[data-theme=&quot;dark&quot;] .axis-tick { stroke: #4a4c44; }
    :root[data-theme=&quot;dark&quot;] .axis-line { stroke: #4a4c44; }</style><circle cx="60" cy="22" r="8" class="event-retry"/><text x="60" y="26" class="event-letter" text-anchor="middle">R</text><text x="74" y="26" class="label-secondary">retry</text><circle cx="140" cy="22" r="8" class="event-email"/><text x="140" y="26" class="event-letter" text-anchor="middle">E</text><text x="154" y="26" class="label-secondary">email</text><text x="40" y="80" class="lane-label-soft">SOFT</text><text x="40" y="96" class="label-secondary">silent retry first</text><path d="M140 90h500" class="lane"/><circle cx="170" cy="90" r="9" class="event-retry"/><text x="170" y="94" class="event-letter" text-anchor="middle">R</text><circle cx="190" cy="90" r="9" class="event-email"/><text x="190" y="94" class="event-letter" text-anchor="middle">E</text><circle cx="240" cy="90" r="9" class="event-retry"/><text x="240" y="94" class="event-letter" text-anchor="middle">R</text><circle cx="310" cy="90" r="9" class="event-retry"/><text x="310" y="94" class="event-letter" text-anchor="middle">R</text><circle cx="330" cy="90" r="9" class="event-email"/><text x="330" y="94" class="event-letter" text-anchor="middle">E</text><circle cx="420" cy="90" r="9" class="event-retry"/><text x="420" y="94" class="event-letter" text-anchor="middle">R</text><circle cx="530" cy="90" r="9" class="event-retry"/><text x="530" y="94" class="event-letter" text-anchor="middle">R</text><circle cx="550" cy="90" r="9" class="event-email"/><text x="550" y="94" class="event-letter" text-anchor="middle">E</text><circle cx="630" cy="90" r="9" class="event-retry"/><text x="630" y="94" class="event-letter" text-anchor="middle">R</text><text x="40" y="150" class="lane-label-hard">HARD</text><text x="40" y="166" class="label-secondary">no retry, email day 0</text><path d="M140 160h500" class="lane"/><circle cx="150" cy="160" r="9" class="event-email"/><text x="150" y="164" class="event-letter" text-anchor="middle">E</text><circle cx="240" cy="160" r="9" class="event-email"/><text x="240" y="164" class="event-letter" text-anchor="middle">E</text><text x="40" y="220" class="lane-label-card">CARD DATA</text><text x="40" y="236" class="label-secondary">email + update link</text><path d="M140 230h500" class="lane"/><circle cx="150" cy="230" r="9" class="event-email"/><text x="150" y="234" class="event-letter" text-anchor="middle">E</text><circle cx="240" cy="230" r="9" class="event-retry"/><text x="240" y="234" class="event-letter" text-anchor="middle">R</text><circle cx="260" cy="230" r="9" class="event-email"/><text x="260" y="234" class="event-letter" text-anchor="middle">E</text><circle cx="380" cy="230" r="9" class="event-retry"/><text x="380" y="234" class="event-letter" text-anchor="middle">R</text><path d="M140 290h500" class="axis-line"/><path d="M150 286v8M240 286v8M310 286v8M380 286v8M420 286v8M530 286v8M630 286v8" class="axis-tick"/><text x="150" y="308" class="label-secondary" text-anchor="middle">D0</text><text x="170" y="308" class="label-secondary" text-anchor="middle">D1</text><text x="240" y="308" class="label-secondary" text-anchor="middle">D3</text><text x="310" y="308" class="label-secondary" text-anchor="middle">D5</text><text x="380" y="308" class="label-secondary" text-anchor="middle">D7</text><text x="420" y="308" class="label-secondary" text-anchor="middle">D8</text><text x="530" y="308" class="label-secondary" text-anchor="middle">D11</text><text x="630" y="308" class="label-secondary" text-anchor="middle">D14</text></svg>