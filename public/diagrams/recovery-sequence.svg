<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 820"><title>Stripe failed-payment recovery sequence by decline category</title><desc>Full recovery flowchart starting from the invoice.payment_failed webhook, classifying the decline code into soft, card data, or hard categories, walking through each category&apos;s day-by-day retry and email schedule, and terminating in a recovered or cancelled outcome.</desc><defs><marker id="arrow-rs" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" class="arrow-head"/></marker></defs><style>.node-neutral { fill: #e8e6e0; stroke: #b0ada6; }
    .node-accent  { fill: #faeeda; stroke: #d4941a; }
    .node-success { fill: #e1f5ee; stroke: #1d9e75; }
    .node-warning { fill: #fcebeb; stroke: #a32d2d; }
    .node-info    { fill: #e6f1fb; stroke: #185fa5; }
    .label-primary   { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; font-family: system-ui, sans-serif; }
    .label-mono      { fill: #1a1c18; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 500; }
    .header          { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
    .connector { stroke: #8a8a7e; stroke-width: 1; fill: none; }
    .arrow-head { fill: #8a8a7e; }
    :root[data-theme=&quot;dark&quot;] .node-neutral { fill: #222420; stroke: #4a4c44; }
    :root[data-theme=&quot;dark&quot;] .node-accent  { fill: #1e1a0a; stroke: #826217; }
    :root[data-theme=&quot;dark&quot;] .node-success { fill: #091e14; stroke: #1f7a5f; }
    :root[data-theme=&quot;dark&quot;] .node-warning { fill: #200a0a; stroke: #b92727; }
    :root[data-theme=&quot;dark&quot;] .node-info    { fill: #0a1428; stroke: #315dc4; }
    :root[data-theme=&quot;dark&quot;] .label-primary   { fill: #f0ede8; }
    :root[data-theme=&quot;dark&quot;] .label-secondary { fill: #a8a49e; }
    :root[data-theme=&quot;dark&quot;] .label-mono      { fill: #f0ede8; }
    :root[data-theme=&quot;dark&quot;] .header          { fill: #f0ede8; }
    :root[data-theme=&quot;dark&quot;] .connector { stroke: #4a4c44; }
    :root[data-theme=&quot;dark&quot;] .arrow-head { fill: #4a4c44; }</style><rect width="240" height="56" x="220" y="20" class="node-accent" rx="8"/><text x="340" y="46" class="label-primary" text-anchor="middle">Stripe webhook fires</text><text x="340" y="64" class="label-mono" text-anchor="middle">invoice.payment_failed</text><path marker-end="url(#arrow-rs)" d="M340 76v30" class="connector"/><rect width="240" height="56" x="220" y="106" class="node-neutral" rx="8"/><text x="340" y="132" class="label-primary" text-anchor="middle">Classify decline_code</text><text x="340" y="150" class="label-secondary" text-anchor="middle">soft / card data / hard</text><path d="M340 162v24M123 186h434" class="connector"/><path marker-end="url(#arrow-rs)" d="M123 186v20" class="connector"/><path marker-end="url(#arrow-rs)" d="M340 186v20" class="connector"/><path marker-end="url(#arrow-rs)" d="M557 186v20" class="connector"/><rect width="140" height="50" x="53" y="206" class="node-info" rx="8"/><text x="123" y="228" class="header" text-anchor="middle">SOFT</text><text x="123" y="246" class="label-secondary" text-anchor="middle">silent retry first</text><rect width="140" height="50" x="270" y="206" class="node-success" rx="8"/><text x="340" y="228" class="header" text-anchor="middle">CARD DATA</text><text x="340" y="246" class="label-secondary" text-anchor="middle">email + update link</text><rect width="140" height="50" x="487" y="206" class="node-warning" rx="8"/><text x="557" y="228" class="header" text-anchor="middle">HARD</text><text x="557" y="246" class="label-secondary" text-anchor="middle">no retry, fast email</text><path marker-end="url(#arrow-rs)" d="M123 256v24" class="connector"/><path marker-end="url(#arrow-rs)" d="M340 256v24" class="connector"/><path marker-end="url(#arrow-rs)" d="M557 256v24" class="connector"/><rect width="140" height="50" x="53" y="280" class="node-neutral" rx="6"/><text x="63" y="300" class="label-mono">D1</text><text x="123" y="306" class="label-primary" text-anchor="middle">Silent retry</text><text x="123" y="322" class="label-secondary" text-anchor="middle">+ email if it fails</text><rect width="140" height="50" x="53" y="350" class="node-neutral" rx="6"/><text x="63" y="370" class="label-mono">D3</text><text x="123" y="376" class="label-primary" text-anchor="middle">Retry</text><text x="123" y="392" class="label-secondary" text-anchor="middle">no email</text><rect width="140" height="50" x="53" y="420" class="node-neutral" rx="6"/><text x="63" y="440" class="label-mono">D5</text><text x="123" y="446" class="label-primary" text-anchor="middle">Retry + email</text><text x="123" y="462" class="label-secondary" text-anchor="middle">friendly nudge</text><rect width="140" height="50" x="53" y="490" class="node-neutral" rx="6"/><text x="63" y="510" class="label-mono">D8</text><text x="123" y="516" class="label-primary" text-anchor="middle">Retry</text><text x="123" y="532" class="label-secondary" text-anchor="middle">silent</text><rect width="140" height="50" x="53" y="560" class="node-neutral" rx="6"/><text x="63" y="580" class="label-mono">D11</text><text x="123" y="586" class="label-primary" text-anchor="middle">Retry + email</text><text x="123" y="602" class="label-secondary" text-anchor="middle">urgency</text><rect width="140" height="50" x="53" y="630" class="node-neutral" rx="6"/><text x="63" y="650" class="label-mono">D14</text><text x="123" y="656" class="label-primary" text-anchor="middle">Final retry</text><text x="123" y="672" class="label-secondary" text-anchor="middle">last chance email</text><path marker-end="url(#arrow-rs)" d="M123 330v20" class="connector"/><path marker-end="url(#arrow-rs)" d="M123 400v20" class="connector"/><path marker-end="url(#arrow-rs)" d="M123 470v20" class="connector"/><path marker-end="url(#arrow-rs)" d="M123 540v20" class="connector"/><path marker-end="url(#arrow-rs)" d="M123 610v20" class="connector"/><rect width="140" height="50" x="270" y="280" class="node-neutral" rx="6"/><text x="280" y="300" class="label-mono">D0</text><text x="340" y="306" class="label-primary" text-anchor="middle">Email customer</text><text x="340" y="322" class="label-secondary" text-anchor="middle">payment update link</text><rect width="140" height="50" x="270" y="350" class="node-neutral" rx="6"/><text x="280" y="370" class="label-mono">D3</text><text x="340" y="376" class="label-primary" text-anchor="middle">Retry + email</text><text x="340" y="392" class="label-secondary" text-anchor="middle">reminder</text><rect width="140" height="50" x="270" y="420" class="node-neutral" rx="6"/><text x="280" y="440" class="label-mono">D7</text><text x="340" y="446" class="label-primary" text-anchor="middle">Retry</text><text x="340" y="462" class="label-secondary" text-anchor="middle">after card likely updated</text><path marker-end="url(#arrow-rs)" d="M340 330v20" class="connector"/><path marker-end="url(#arrow-rs)" d="M340 400v20" class="connector"/><path stroke-dasharray="4 4" d="M340 470v250" class="connector"/><rect width="140" height="50" x="487" y="280" class="node-neutral" rx="6"/><text x="497" y="300" class="label-mono">D0</text><text x="557" y="306" class="label-primary" text-anchor="middle">Email customer</text><text x="557" y="322" class="label-secondary" text-anchor="middle">update payment method</text><rect width="140" height="50" x="487" y="350" class="node-neutral" rx="6"/><text x="497" y="370" class="label-mono">D3</text><text x="557" y="376" class="label-primary" text-anchor="middle">Final notice email</text><text x="557" y="392" class="label-secondary" text-anchor="middle">no further retries</text><path marker-end="url(#arrow-rs)" d="M557 330v20" class="connector"/><path stroke-dasharray="4 4" d="M557 400v320M123 680v40" class="connector"/><rect width="280" height="70" x="53" y="720" class="node-success" rx="10"/><text x="193" y="748" class="header" text-anchor="middle">RECOVERED</text><text x="193" y="766" class="label-secondary" text-anchor="middle">retry succeeds or customer updates card</text><text x="193" y="782" class="label-secondary" text-anchor="middle">pending emails cancel automatically</text><rect width="280" height="70" x="347" y="720" class="node-warning" rx="10"/><text x="487" y="748" class="header" text-anchor="middle">CANCELLED</text><text x="487" y="766" class="label-secondary" text-anchor="middle">no recovery after 30 days</text><text x="487" y="782" class="label-secondary" text-anchor="middle">subscription cancels, win-back queued</text></svg>