<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380"><title>MRR waterfall comparison — Company A vs Company B</title><desc>Two side-by-side MRR waterfall charts showing how Company A and Company B can post the same $10k net new MRR while having radically different gross movements, illustrating why net MRR alone hides the health signal.</desc><style>.bar-positive { fill: #e1f5ee; stroke: #1d9e75; }
    .bar-negative { fill: #fcebeb; stroke: #a32d2d; }
    .bar-net      { fill: #faeeda; stroke: #d4941a; }
    .label-primary   { fill: #1a1c18; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    .label-secondary { fill: #595c56; font-family: system-ui, sans-serif; font-size: 11px; font-family: system-ui, sans-serif; }
    .label-accent    { fill: #8a5c06; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
    .baseline { stroke: #595c56; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
    .axis { stroke: #8a8a7e; stroke-width: 1; }
    :root:not([data-theme=&quot;light&quot;]) .bar-positive { fill: #091e14; stroke: #1f7a5f; }
    :root:not([data-theme=&quot;light&quot;]) .bar-negative { fill: #200a0a; stroke: #b92727; }
    :root:not([data-theme=&quot;light&quot;]) .bar-net      { fill: #1e1a0a; stroke: #826217; }
    :root:not([data-theme=&quot;light&quot;]) .label-primary   { fill: #f0ede8; }
    :root:not([data-theme=&quot;light&quot;]) .label-secondary { fill: #a8a49e; }
    :root:not([data-theme=&quot;light&quot;]) .label-accent    { fill: #f0b429; }
    :root:not([data-theme=&quot;light&quot;]) .baseline { stroke: #a8a49e; }
    :root:not([data-theme=&quot;light&quot;]) .axis { stroke: #4a4c44; }</style><text x="40" y="24" class="label-primary">Same net MRR. Different gross. Different health.</text><text x="180" y="60" class="label-primary" text-anchor="middle">COMPANY A</text><text x="180" y="76" class="label-secondary" text-anchor="middle">high churn, replaced by new sales</text><path d="M40 210h280" class="baseline"/><path d="M40 100v210" class="axis"/><path d="M55 110h40v100H55z" class="bar-positive"/><text x="75" y="100" class="label-secondary" text-anchor="middle">+$50k</text><text x="75" y="324" class="label-secondary" text-anchor="middle">New</text><path d="M107 200h40v10h-40z" class="bar-positive"/><text x="127" y="194" class="label-secondary" text-anchor="middle">+$5k</text><text x="127" y="324" class="label-secondary" text-anchor="middle">Exp</text><path d="M159 210h40v40h-40z" class="bar-negative"/><text x="179" y="262" class="label-secondary" text-anchor="middle">-$20k</text><text x="179" y="324" class="label-secondary" text-anchor="middle">Contr</text><path d="M211 210h40v50h-40z" class="bar-negative"/><text x="231" y="272" class="label-secondary" text-anchor="middle">-$25k</text><text x="231" y="324" class="label-secondary" text-anchor="middle">Churn</text><path d="M263 190h40v20h-40z" class="bar-net"/><text x="283" y="184" class="label-accent" text-anchor="middle">+$10k</text><text x="283" y="324" class="label-secondary" text-anchor="middle">Net</text><text x="40" y="346" class="label-secondary">Churn = 50% of new. Hidden churn problem.</text><text x="500" y="60" class="label-primary" text-anchor="middle">COMPANY B</text><text x="500" y="76" class="label-secondary" text-anchor="middle">low churn, mostly expansion</text><path d="M360 210h280" class="baseline"/><path d="M360 100v210" class="axis"/><path d="M375 180h40v30h-40z" class="bar-positive"/><text x="395" y="174" class="label-secondary" text-anchor="middle">+$15k</text><text x="395" y="324" class="label-secondary" text-anchor="middle">New</text><path d="M427 194h40v16h-40z" class="bar-positive"/><text x="447" y="188" class="label-secondary" text-anchor="middle">+$8k</text><text x="447" y="324" class="label-secondary" text-anchor="middle">Exp</text><path d="M479 210h40v10h-40z" class="bar-negative"/><text x="499" y="232" class="label-secondary" text-anchor="middle">-$5k</text><text x="499" y="324" class="label-secondary" text-anchor="middle">Contr</text><path d="M531 210h40v16h-40z" class="bar-negative"/><text x="551" y="238" class="label-secondary" text-anchor="middle">-$8k</text><text x="551" y="324" class="label-secondary" text-anchor="middle">Churn</text><path d="M583 190h40v20h-40z" class="bar-net"/><text x="603" y="184" class="label-accent" text-anchor="middle">+$10k</text><text x="603" y="324" class="label-secondary" text-anchor="middle">Net</text><text x="360" y="346" class="label-secondary">Churn = 53% of new but on a small base. Healthy.</text></svg>