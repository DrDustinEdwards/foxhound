name: ai-author

# Devkit's gate that refuses an AI attribution trailer on a commit a push or pull request adds
# (and a commit authored or committed as Claude on a pull request): portfolio rule, no AI
# attribution on any commit. The bin comes from the devkit tag in package.json; the workflow is
# pinned by full sha, which devkit's scripts/check-callers.mjs requires. Move both together.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels its older run; a push to the default branch never does.
concurrency:
  group: ai-author-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ai-author:
    uses: DrDustinEdwards/devkit/.github/workflows/ai-author.yml@71f342e07f91d3be216f2dfd8e9815a0f9f7299c # v0.20.13
