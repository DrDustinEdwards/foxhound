name: dependencies

# OSV-Scanner, daily (devkit dependencies.yml): the run that finds an advisory published after a merge. A pull request is
# scanned in checks.yml (devkit pr.yml), where only a vulnerability the change adds fails. Exceptions go in
# osv-scanner.toml at the repository root, each with its reason. No push to main (devkit README, "No second run on main").

on:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    uses: DrDustinEdwards/devkit/.github/workflows/dependencies.yml@a5562b298a5aa36f32c336ca153d47da09306862 # v0.24.1
