name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review is listed so a draft gets its full run the moment it
    # leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]

# Actions minutes are shared and capped (Dustin's account, 2026-10-15: 90% of
# the month's 2,000 used). On a pull request a newer push makes the older run
# worthless, so it is canceled and the newest push still gets the full run.
# On main nothing is canceled mid-run, so a deploy is never cut off.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    # Dustin, 2026-10-15: "Yes, change Foxhound's CI to skip draft PRs and skip
    # main's repeat run when the code already passed on the PR." A draft is
    # still being written and cannot be merged, so it runs nothing; it gets the
    # full run when it is marked ready, and on every push after that.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    # Pinned by commit sha and time-limited (capsid residual 6, 2026-09-08).
    # A tag is a moving pointer its owner can repoint at any time, and a job with
    # no timeout-minutes inherits GitHub's 360-minute default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The second half of the 2026-10-15 ruling above. A merge to main whose
      # tree is byte for byte the tree its pull request already passed verify
      # on has nothing new to test: same files, same commands. That is the
      # normal case, because a pull request is brought up to date with main
      # before it merges. Then the steps below are skipped and the deploy goes
      # ahead on that pull request's passing run. Any difference at all (a
      # behind branch merged, a direct push, a failed lookup) runs everything.
      - name: Was this exact tree already verified?
        id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TREE=$(git rev-parse "HEAD^{tree}")
          for HEAD_SHA in $(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].head.sha' 2>/dev/null); do
            HEAD_TREE=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}" --jq .tree.sha 2>/dev/null || true)
            PASSED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=verify" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
            if [ "$HEAD_TREE" = "$TREE" ] && [ "${PASSED:-0}" -gt 0 ]; then
              echo "tree ${TREE} already passed verify on pull request head ${HEAD_SHA}; not repeating it"
              echo "same=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no passing pull request run on this exact tree; running every step"
          echo "same=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.tested.outputs.same != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.tested.outputs.same != 'true'
        run: npm ci

      - name: Check design tokens
        if: steps.tested.outputs.same != 'true'
        run: npm run check-tokens

      - name: Typecheck
        if: steps.tested.outputs.same != 'true'
        run: npm run typecheck

      # Lint is one of the four gates check-gates reports as wired, and until
      # ruling 378 call (b) it was the one gate CI did not run. It went red at
      # some point and stayed red, invisibly, because check:all was the only
      # thing that ran it and nothing ran check:all. A gate the pipeline does
      # not run is not a gate (153, 318).
      - name: Lint
        if: steps.tested.outputs.same != 'true'
        run: npm run lint

      - name: Build
        if: steps.tested.outputs.same != 'true'
        run: npm run build

      # Raw console.* calls in server code against .console.json's baseline (a
      # rise fails; log through site-runtime ./log instead), and the migrations
      # against drizzle/migrations-manifest.json (an applied one edited or gone,
      # or a new one that drops or renames without `-- contract:`, fails).
      - name: Console ratchet and expand-only migrations
        if: steps.tested.outputs.same != 'true'
        run: npm run check:console && npm run check:migrations

      # Knip (unused files, exports, dependencies) and jscpd (duplication)
      # against .no-bloat.json: a count above its baseline fails. Lower it with
      # `npx devkit-no-bloat --write-baseline` when a count goes down.
      - name: No-bloat ratchet
        if: steps.tested.outputs.same != 'true'
        run: npm run check:bloat

      # A gate (area 7, D5): a route over .route-weight.json's budget_bytes, or
      # grown past its baseline, fails the run.
      - name: Page weight
        if: steps.tested.outputs.same != 'true'
        run: npm run check:page-weight

      # Warn only: tests with no assertion. continue-on-error keeps a crash
      # from failing the run.
      - name: Assertion report (warn only)
        if: steps.tested.outputs.same != 'true'
        continue-on-error: true
        run: npm run report:assertions

      - name: Test
        if: steps.tested.outputs.same != 'true'
        run: npm test

  # devkit's shared deploy (worker-deploy.yml). Its deploy job applies the D1
  # migrations first (schema before code: a failing migration never reaches the
  # Worker, and old code against an old schema still works) through
  # devkit-migrations --apply, which applies only the pending migrations that
  # add and refuses a drop, rename or row delete (a table recreate included)
  # with the command to run it by hand, so those wait for Dustin. Then it
  # builds, and deploys with DEPLOY_SHA set to this commit. Its live gate waits
  # for /health to report that commit, then runs scripts/verify-live.mjs (the
  # home page and every hashed asset it names answer 200), and rolls the deploy
  # back on a refusal. A rollback never undoes a migration.
  #
  # NO GRADUAL ROLLOUT AND NO PER-PR PREVIEW (worker-deploy's gradual-percent
  # and preview stay off), both because of the Durable Objects:
  # - Gradual: wrangler.jsonc declares its Durable Objects in `exports`, and
  #   Cloudflare does not support gradual deployments there (Cloudflare Docs,
  #   "Durable Objects migrations", Constraints: "Gradual deployments are not
  #   supported with exports"; a class added to `exports` cannot go up as a
  #   version at all).
  # - Preview: Cloudflare generates no preview URL for a Worker that implements
  #   a Durable Object (Cloudflare Docs, "Version URLs", Limitations), and
  #   workers_dev is off. Even with one, a preview version runs with this
  #   Worker's own bindings: production D1, the Stripe keys, the EMAIL send
  #   binding and the queues. A reviewer's click could send dunning mail or
  #   write a fee row, which CLAUDE.md hard rule 6 forbids. A safe preview needs
  #   a second Worker with its own D1, test-mode Stripe keys and no send
  #   binding, which is a build and a ruling (one Worker, CLAUDE.md), not a flag.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # worker-deploy.yml's jobs ask for contents: read and nothing more.
    permissions:
      contents: read
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@017fccd9e3f316a9dfb9b8e1495592dffc677278 # v0.20.21
    with:
      worker-name: foxhound
      health-url: https://foxhoundapp.com/health
      verify-command: node scripts/verify-live.mjs
      pre-deploy: npx devkit-migrations drizzle/migrations --apply foxhound && npm run build
      # The Time Travel bookmark from before the migrations above, with its restore command, in the run's summary.
      d1-database: foxhound
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The admin MCP Worker (mcp/), the one second Worker, through the same shared
  # deploy once the foxhound Worker it binds is live. mcp/wrangler.jsonc holds
  # no secret, so the deploy reads it as committed; its dependencies are the
  # root's. The live gate waits for its /health to report this commit, runs
  # scripts/verify-admin-mcp.mjs, and rolls it back on a refusal.
  admin-mcp-deploy:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@017fccd9e3f316a9dfb9b8e1495592dffc677278 # v0.20.21
    with:
      worker-name: foxhound-admin-mcp
      working-directory: mcp
      install: cd .. && npm ci
      health-url: https://admin-mcp.foxhoundapp.com/health
      verify-command: node ../scripts/verify-admin-mcp.mjs
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
