name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review is listed so a draft gets its full run the moment it
    # leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]

# Actions minutes are shared and capped (Dustin's account, 2026-10-15: 90% of
# the month's 2,000 used). On a pull request a newer push makes the older run
# worthless, so it is canceled and the newest push still gets the full run.
# On main nothing is canceled mid-run, so a deploy is never cut off.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    # Dustin, 2026-10-15: "Yes, change Foxhound's CI to skip draft PRs and skip
    # main's repeat run when the code already passed on the PR." A draft is
    # still being written and cannot be merged, so it runs nothing; it gets the
    # full run when it is marked ready, and on every push after that.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    # Pinned by commit sha and time-limited (capsid residual 6, 2026-09-08).
    # A tag is a moving pointer its owner can repoint at any time, and a job with
    # no timeout-minutes inherits GitHub's 360-minute default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The second half of the 2026-10-15 ruling above. A merge to main whose
      # tree is byte for byte the tree its pull request already passed verify
      # on has nothing new to test: same files, same commands. That is the
      # normal case, because a pull request is brought up to date with main
      # before it merges. Then the steps below are skipped and the deploy goes
      # ahead on that pull request's passing run. Any difference at all (a
      # behind branch merged, a direct push, a failed lookup) runs everything.
      - name: Was this exact tree already verified?
        id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          TREE=$(git rev-parse "HEAD^{tree}")
          for HEAD_SHA in $(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[].head.sha' 2>/dev/null); do
            HEAD_TREE=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${HEAD_SHA}" --jq .tree.sha 2>/dev/null || true)
            PASSED=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=verify" --jq '[.check_runs[] | select(.conclusion == "success")] | length' 2>/dev/null || echo 0)
            if [ "$HEAD_TREE" = "$TREE" ] && [ "${PASSED:-0}" -gt 0 ]; then
              echo "tree ${TREE} already passed verify on pull request head ${HEAD_SHA}; not repeating it"
              echo "same=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no passing pull request run on this exact tree; running every step"
          echo "same=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.tested.outputs.same != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.tested.outputs.same != 'true'
        run: npm ci

      - name: Check design tokens
        if: steps.tested.outputs.same != 'true'
        run: npm run check-tokens

      - name: Typecheck
        if: steps.tested.outputs.same != 'true'
        run: npm run typecheck

      # Lint is one of the four gates check-gates reports as wired, and until
      # ruling 378 call (b) it was the one gate CI did not run. It went red at
      # some point and stayed red, invisibly, because check:all was the only
      # thing that ran it and nothing ran check:all. A gate the pipeline does
      # not run is not a gate (153, 318).
      - name: Lint
        if: steps.tested.outputs.same != 'true'
        run: npm run lint

      - name: Build
        if: steps.tested.outputs.same != 'true'
        run: npm run build

      # Knip (unused files, exports, dependencies) and jscpd (duplication)
      # against .no-bloat.json: a count above its baseline fails. Lower it with
      # `npx devkit-no-bloat --write-baseline` when a count goes down.
      - name: No-bloat ratchet
        if: steps.tested.outputs.same != 'true'
        run: npm run check:bloat

      # Warn only: page weight per route from this build, and tests with no
      # assertion. continue-on-error keeps a crash from failing the run.
      - name: Bloat report (warn only)
        if: steps.tested.outputs.same != 'true'
        continue-on-error: true
        run: npm run report:bloat

      - name: Test
        if: steps.tested.outputs.same != 'true'
        run: npm test

  # devkit's shared deploy (worker-deploy.yml). Its deploy job applies the D1
  # migrations first (schema before code: a failing migration never reaches the
  # Worker, and old code against an old schema still works; DB_MIGRATE_CONFIRM
  # is the opt-in scripts/db-migrate.mjs demands before touching production),
  # builds, and deploys with DEPLOY_SHA set to this commit. Its live gate waits
  # for /health to report that commit, then runs scripts/verify-live.mjs (the
  # home page and every hashed asset it names answer 200), and rolls the deploy
  # back on a refusal. A rollback never undoes a migration.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: DrDustinEdwards/devkit/.github/workflows/worker-deploy.yml@a793fd1aecc646bbf2bbbf76032d9034d840e007 # v0.16.1
    with:
      worker-name: foxhound
      health-url: https://foxhoundapp.com/health
      verify-command: node scripts/verify-live.mjs
      pre-deploy: DB_MIGRATE_CONFIRM=1 npm run db:migrate && npm run build
      sha-var: DEPLOY_SHA
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
