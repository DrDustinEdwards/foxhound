name: restore-drill

# The weekly restore drill (devkit's restore-drill.yml): d1-dump downloads the newest complete dump from
# foxhound-backups, restores it into a scratch SQLite file and checks the copy. The token reads the backups bucket only
# (R2: Read), so the drill changes nothing.

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@71fed4a06c3cb6808c5bfead4da98bd88ef62c3c # v0.53.2
    with:
      bucket: foxhound-backups
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
