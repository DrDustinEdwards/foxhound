name: restore-drill

# The weekly restore drill (devkit's restore-drill.yml): d1-dump downloads the newest complete dump from
# foxhound-backups, restores it into a scratch SQLite file and checks the copy. The token reads the backups bucket only
# (R2: Read), so the drill changes nothing.

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    uses: DrDustinEdwards/devkit/.github/workflows/restore-drill.yml@454002f526e5e8e645a9c110605880e220b611a0 # v0.21.0
    with:
      bucket: foxhound-backups
      d1-dump-ref: v0.7.1
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
