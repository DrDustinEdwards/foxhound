name: worker-size

# The Worker bundle size budget in .worker-size.json, checked by devkit's shared worker-size.yml against
# `wrangler deploy --dry-run` of the build. No secret: a dry run never talks to the account.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-size-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@1664a50ccc3b02a5100d490a650343db0e8b8530 # v0.20.4
    with:
      prepare: npm run build
