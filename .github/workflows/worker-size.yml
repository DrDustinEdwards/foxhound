name: worker-size

# The Worker bundle size budget in .worker-size.json, checked by devkit's shared worker-size.yml against
# `wrangler deploy --dry-run` of the build. No secret: a dry run never talks to the account.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-size-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@be78f8296e6c4dfc5cbf0aa17223f15ce4ff4ec8 # v0.13.1
    with:
      prepare: npm run build
