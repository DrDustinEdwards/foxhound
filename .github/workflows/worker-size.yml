name: worker-size

# The Worker bundle size budgets, checked by devkit's shared worker-size.yml against `wrangler deploy --dry-run`:
# .worker-size.json for the foxhound Worker's build, .worker-size.mcp.json for the admin MCP Worker (mcp/).
# No secret: a dry run never talks to the account.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: worker-size-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  worker-size:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@017fccd9e3f316a9dfb9b8e1495592dffc677278 # v0.20.21
    with:
      prepare: npm run build

  admin-mcp:
    uses: DrDustinEdwards/devkit/.github/workflows/worker-size.yml@017fccd9e3f316a9dfb9b8e1495592dffc677278 # v0.20.21
    with:
      config: .worker-size.mcp.json
