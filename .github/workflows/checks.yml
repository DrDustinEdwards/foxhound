name: checks

# devkit's pull request checks in one job (pr.yml): the "Generated by Claude Code" footer removed from pull request
# descriptions, no AI trailer or author on new commits, the shared-code check, OSV-Scanner on what the change adds,
# actionlint and zizmor when .github/ changes, the bundle size of both Workers and the reviewer (advisory). Exceptions to
# the shared-code check are in .shared.json with their reasons, OSV-Scanner's in osv-scanner.toml, the workflow audit's
# in .github/actionlint.yaml and .github/zizmor.yml. What is shared:
# https://github.com/DrDustinEdwards/devkit/blob/shared-list/SHARED.md
# Run it by hand once to clean the footer from every past pull request.
#
# No push to main: the merge was checked as a pull request (devkit README, "No second run on main"). The deploys and the
# verify job they need are in ci.yml.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# The pull request is the group, so a newer push cancels the older run.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id makes the check "checks / Repo checks", the name main's ruleset requires.
  checks:
    # A called workflow holds no more than this job grants: the footer writes the description, the reviewer signs in to
    # Capsid with the job's OIDC token and writes its check.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: write
    uses: DrDustinEdwards/devkit/.github/workflows/pr.yml@7cfb9285fae4080d856d58a501d906a1b3e471f6 # v0.26.3
    with:
      review: true
      # ci.yml's verify job runs devkit-no-bloat (npm run check:bloat).
      no-bloat: false
      # .worker-size.json for the foxhound Worker's build, .worker-size.mcp.json for the admin MCP Worker (its args point
      # the dry run at mcp/wrangler.jsonc). No secret: a dry run never talks to the account.
      workers: >-
        [{ "name": "foxhound", "prepare": "npm run build" },
         { "name": "admin-mcp", "config": ".worker-size.mcp.json" }]
