name: improve-score

# THE SCORER, SPLIT INTO TWO JOBS (audit 2026-09-06, option a). foxhound copy.
# This namespace's PRIMARY repo; legacy recova and recova-mcp must not get this file.
#
#   build  (PER REPO, no secrets) runs this repo's own build/test/lint/measure and
#          writes a normalized metrics.json plus the attempt source under code/.
#   score  (BYTE-IDENTICAL across all five roster repos) overlays the source, pulls
#          the holdout, counts passes from node --test's TAP reporter via
#          scripts/improve-report.mjs (never an exit code), reads metrics.json,
#          signs and posts.
#
# ONLY THE build JOB DIFFERS PER REPO. The score job and scripts/improve-report.mjs
# are copied verbatim from capsid-mcp; edit them there and re-copy.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: The attempt branch to score.
        required: true
      run_id:
        description: The improve run this attempt belongs to.
        required: true
      attempt_id:
        description: The attempt being scored. The literal suffix -baseline measures the base.
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build (per-repo, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
      # THE ANCHOR COMES FROM A STEP OUTCOME, NOT FROM THE ARTIFACT (audit
      # 2026-09-07, Grok MAJOR 3). metrics.json is written on a runner that has
      # already executed attempt code, so a detached writer can rewrite it before
      # the upload. A job output is set by the Actions runner from the step's own
      # result and attempt code cannot reach it.
      build_passes: ${{ steps.build.outcome == 'success' && '1' || '0' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Capture the attempt head sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stamp the start
        id: started
        run: echo "epoch=$(date -u +%s)" > started.txt

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- PER-REPO. foxhound: react-router, vitest, eslint. ----
      - name: Build
        id: build
        continue-on-error: true
        run: npm run typecheck

      # vitest's JSON reporter writes a jest-shaped summary file; counts come from
      # it, never from parsing the terminal summary, whose "Tests N passed" line is
      # wrapped in ANSI colour codes that broke the old regex.
      - name: Test
        id: test
        continue-on-error: true
        run: npm test -- --reporter=json --outputFile=test-report.json

      - name: Measure
        id: measure
        continue-on-error: true
        run: |
          set -uo pipefail
          BUILD_PASSES=0; [ "${{ steps.build.outcome }}" = "success" ] && BUILD_PASSES=1
          # Read the JSON report; "" (-> null) when it was never written.
          RATE=$(node -e '
            const fs=require("fs");
            try {
              const r=JSON.parse(fs.readFileSync("test-report.json","utf8"));
              const p=r.numPassedTests||0,f=r.numFailedTests||0;
              process.stdout.write(p+f>0?String(p/(p+f)):"");
            } catch { process.stdout.write(""); }
          ')
          if npm run lint > lint-output.txt 2>&1; then LINT_COUNT=0; else LINT_COUNT=$(grep -cE "^[[:space:]]+[0-9]+:[0-9]+" lint-output.txt || true); [ "${LINT_COUNT}" = "0" ] && LINT_COUNT=""; fi
          BUNDLE_BYTES=$(npm run build > /dev/null 2>&1 && du -sb build 2>/dev/null | cut -f1 || echo "")
          BUILD_PASSES="${BUILD_PASSES}" RATE="${RATE}" LINT_COUNT="${LINT_COUNT}" BUNDLE_BYTES="${BUNDLE_BYTES}" node -e '
            const n=(v)=>(v===undefined||v===""?null:Number(v));
            process.stdout.write(JSON.stringify({
              build_passes: Number(process.env.BUILD_PASSES||"0"),
              test_pass_rate: n(process.env.RATE),
              lint_count: n(process.env.LINT_COUNT),
              bundle_size_bytes: n(process.env.BUNDLE_BYTES),
            }));
          ' > metrics.json
          cat metrics.json

      # PER-REPO: the source tree(s) the holdout imports. foxhound: app, workers.
      - name: Stage the scored source
        run: |
          set -euo pipefail
          # `rm -rf code` FIRST (audit 2026-09-07, Grok CRITICAL 1): without it, a
          # code/ directory written by attempt code during the Test step above
          # survives into the artifact alongside the trees this step stages.
          rm -rf code
          mkdir -p code
          cp -r app code/
          cp -r workers code/

      - name: Upload the attempt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attempt
          retention-days: 1
          path: |
            metrics.json
            started.txt
            code

  # ============================================================================
  # BYTE-IDENTICAL BELOW THIS LINE ACROSS ALL FIVE ROSTER REPOS. Do not edit one
  # copy; edit capsid-mcp's and re-copy. test/workflow-identity.test.ts pins it.
  # ============================================================================
  score:
    name: score (holds secrets)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # THE DEFAULT BRANCH ONLY. Nothing from the attempt branch is ever checked
      # out here, and nothing is ever overlaid onto this working tree.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          # Off because it would auto-run the package manager to locate a cache dir
          # before corepack has provisioned pnpm for a pnpm-workspace repo.
          package-manager-cache: false

      # PACKAGE-MANAGER AGNOSTIC so this job stays byte-identical across an npm repo
      # and a pnpm workspace: pnpm-lock.yaml picks pnpm (via corepack, honouring the
      # repo's packageManager field), otherwise npm ci. Both read the DEFAULT
      # branch's lockfile, which an attempt cannot edit (it is a protected path).
      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      # THE TRUSTED SCRIPT AND THE NODE BINARY ARE RESOLVED BEFORE ANY UNTRUSTED
      # BYTE EXISTS ON THIS RUNNER, and only these copies are used afterwards.
      # Even though nothing untrusted is written to the workspace any more, this
      # is what makes that property independent of the steps below staying correct.
      - name: Stash the trusted scorer and resolve absolute binaries
        id: trusted
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trusted"
          cp scripts/improve-report.mjs "${RUNNER_TEMP}/trusted/improve-report.mjs"
          echo "node=$(command -v node)" >> "$GITHUB_OUTPUT"

      # Into RUNNER_TEMP, never the workspace, so the attempt tree and the
      # default-branch checkout never share a directory.
      - name: Download the attempt artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: attempt
          path: ${{ runner.temp }}/attempt

      # NO LONG-LIVED R2 SECRET. The holdout is pulled with a ONE-HOUR
      # object-read-only credential scoped to this namespace's prefix, minted by
      # the Worker on request and signed with the same per-namespace key as the
      # score report. This step's env holds only the signing key; no attempt code
      # runs on this runner at all. Checksums are when_required because R2
      # rejects the CRC headers newer aws CLIs send by default.
      #
      # WIPED BEFORE THE SYNC (audit 2026-09-07, Grok CRITICAL 1): `aws s3 sync`
      # has no --delete here, so a pre-existing file under the destination would
      # survive and be counted as a case.
      - name: Pull the holdout suite
        id: holdout
        continue-on-error: true
        env:
          IMPROVE_SCORE_KEY: ${{ secrets.IMPROVE_SCORE_KEY }}
          IMPROVE_NAMESPACE: ${{ vars.IMPROVE_NAMESPACE }}
          CAPSID_URL: https://capsid.dustin-edwards.workers.dev
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          NODE_OPTIONS: ""
          NODE_BIN: ${{ steps.trusted.outputs.node }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BODY=$("${NODE_BIN}" -e 'process.stdout.write(JSON.stringify({ namespace: process.env.IMPROVE_NAMESPACE, jti: require("crypto").randomUUID() }))')
          SIG=$(TS="${TS}" BODY="${BODY}" "${NODE_BIN}" -e 'const c=require("crypto");const h=c.createHmac("sha256",process.env.IMPROVE_SCORE_KEY);h.update(process.env.TS+"."+process.env.BODY);process.stdout.write(h.digest("hex"))')
          CRED_FILE=$(mktemp)
          STATUS=$(/usr/bin/curl --silent --show-error -o "${CRED_FILE}" -w '%{http_code}' \
            -X POST "${CAPSID_URL}/improve/holdout-credential" \
            -H "Content-Type: application/json" \
            -H "X-Improve-Namespace: ${IMPROVE_NAMESPACE}" \
            -H "X-Improve-Timestamp: ${TS}" \
            -H "X-Improve-Signature: ${SIG}" \
            --data "${BODY}")
          if [ "${STATUS}" != "200" ]; then
            echo "holdout credential request failed (HTTP ${STATUS}):" >&2
            cat "${CRED_FILE}" >&2
            exit 1
          fi
          # The credential values are exported for the aws CLI and never echoed.
          eval "$(CRED_FILE="${CRED_FILE}" "${NODE_BIN}" -e '
            const c = JSON.parse(require("fs").readFileSync(process.env.CRED_FILE, "utf8"));
            const fields = [["AWS_ACCESS_KEY_ID", c.access_key_id], ["AWS_SECRET_ACCESS_KEY", c.secret_access_key], ["AWS_SESSION_TOKEN", c.session_token], ["HOLDOUT_ENDPOINT", c.endpoint], ["HOLDOUT_BUCKET", c.bucket], ["HOLDOUT_PREFIX", c.prefix]];
            for (const [name, value] of fields) {
              if (!value) { console.error("missing " + name + " in the credential response"); process.exit(1); }
              process.stdout.write("export " + name + "=" + JSON.stringify(value) + "\n");
            }')"
          rm -rf "${RUNNER_TEMP}/holdout"
          mkdir -p "${RUNNER_TEMP}/holdout"
          aws s3 sync "s3://${HOLDOUT_BUCKET}/${HOLDOUT_PREFIX}" "${RUNNER_TEMP}/holdout/" --endpoint-url "${HOLDOUT_ENDPOINT}"

      # THE ONLY PLACE ATTEMPT CODE EVER RUNS IN THIS JOB, and it runs with no
      # network, a read-only root, no workspace mount, and no secret in scope.
      #
      #   --network none    nothing it learns can leave, including the suite.
      #   --read-only       the image and every bind mount stay immutable.
      #   -v ...:ro         attempt, holdout and node_modules are read-only.
      #   --tmpfs /work     the only writable surface, and it dies with the run.
      #   pinned by digest  so the image cannot be repointed under us.
      #
      # RESULTS LEAVE AS A STDOUT PIPE. There is no seekable TAP destination for
      # the child to rewrite: the reporter writes to the container's stdout, the
      # runner captures it outside the container, and a test's own stdout is
      # escaped by node's TAP reporter into `# ` comment lines, so it cannot forge
      # a result line at column 0. The per-case markers below are emitted by this
      # trusted shell, never by a test.
      - name: Run the holdout suite in an isolated container
        id: holdout_run
        continue-on-error: true
        run: |
          set -uo pipefail
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /work:rw,exec,size=512m \
            --tmpfs /tmp:rw,size=64m \
            -v "${RUNNER_TEMP}/attempt/code:/attempt:ro" \
            -v "${RUNNER_TEMP}/holdout:/holdout:ro" \
            -v "${GITHUB_WORKSPACE}/node_modules:/nm:ro" \
            -v "${GITHUB_WORKSPACE}/test:/trusted-test:ro" \
            -w /work \
            --entrypoint /bin/sh \
            node:24.14.1-alpine@sha256:8510330d3eb72c804231a834b1a8ebb55cb3796c3e4431297a24d246b8add4d5 \
            -c '
              set -u
              cp -R /attempt/. /work/ 2>/dev/null || true
              ln -s /nm /work/node_modules
              if [ -f /trusted-test/resolve-ts.mjs ]; then
                mkdir -p /work/test
                cp /trusted-test/resolve-ts.mjs /work/test/resolve-ts.mjs
              fi
              mkdir -p /work/.holdout
              cp /holdout/*.test.* /work/.holdout/ 2>/dev/null || true
              LOADER=""
              [ -f /work/test/resolve-ts.mjs ] && LOADER="--import ./test/resolve-ts.mjs"
              for f in /work/.holdout/*.test.*; do
                [ -e "$f" ] || continue
                echo "##CAPSID-CASE $(basename "$f")"
                # shellcheck disable=SC2086
                node --test --test-reporter=tap $LOADER "$f" 2>/dev/null || true
              done
              echo "##CAPSID-END"
            ' > "${RUNNER_TEMP}/holdout.tap" 2>"${RUNNER_TEMP}/holdout.err" || true
          echo "container exited $?"
          tail -5 "${RUNNER_TEMP}/holdout.err" || true

      # Counting is done by the trusted copy, from the piped stream, against the
      # manifest that came out of R2. Both live outside the workspace.
      - name: Count the holdout result
        id: holdout_count
        continue-on-error: true
        env:
          NODE_BIN: ${{ steps.trusted.outputs.node }}
        run: |
          set -uo pipefail
          TOTAL=$("${NODE_BIN}" -e 'try{process.stdout.write(String(require(process.env.RUNNER_TEMP + "/holdout/manifest.json").total))}catch{process.stdout.write("")}')
          PASSED=$("${NODE_BIN}" "${RUNNER_TEMP}/trusted/improve-report.mjs" --holdout-stream "${RUNNER_TEMP}/holdout.tap" || echo "0")
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "passed=${PASSED}" >> "$GITHUB_OUTPUT"
          echo "holdout ${PASSED} of ${TOTAL}"

      # RUN_ID, ATTEMPT_ID, BUILD_PASSES and the key are in THIS step's own env so a
      # poisoned GITHUB_ENV cannot override them; NODE_OPTIONS is cleared; the HMAC is
      # computed by node with the key read from the environment, never argv; node and
      # curl are absolute-pathed. ci_minutes is computed before the body.
      - name: Post the score report
        if: always()
        env:
          IMPROVE_SCORE_KEY: ${{ secrets.IMPROVE_SCORE_KEY }}
          IMPROVE_NAMESPACE: ${{ vars.IMPROVE_NAMESPACE }}
          CAPSID_URL: https://capsid.dustin-edwards.workers.dev
          RUN_ID: ${{ inputs.run_id }}
          ATTEMPT_ID: ${{ inputs.attempt_id }}
          ATTEMPT_HEAD_SHA: ${{ needs.build.outputs.head_sha }}
          BUILD_PASSES: ${{ needs.build.outputs.build_passes }}
          HOLDOUT_TOTAL: ${{ steps.holdout_count.outputs.total }}
          HOLDOUT_PASSED: ${{ steps.holdout_count.outputs.passed }}
          NODE_OPTIONS: ""
          NODE_BIN: ${{ steps.trusted.outputs.node }}
        run: |
          set -euo pipefail
          if [ -z "${IMPROVE_SCORE_KEY}" ]; then
            echo "IMPROVE_SCORE_KEY is unset; the report cannot be signed and will not be sent." >&2
            exit 1
          fi
          STARTED_EPOCH=$(sed -n 's/^epoch=//p' "${RUNNER_TEMP}/attempt/started.txt" 2>/dev/null || echo "")
          export CI_MINUTES=$(S="${STARTED_EPOCH}" N="$(date -u +%s)" "${NODE_BIN}" -e 'const s=Number(process.env.S||"0"),n=Number(process.env.N||"0");process.stdout.write(s>0?((n-s)/60).toFixed(2):"0")')
          BODY=$("${NODE_BIN}" "${RUNNER_TEMP}/trusted/improve-report.mjs" "${RUNNER_TEMP}/attempt/metrics.json" "${HOLDOUT_TOTAL}" "${HOLDOUT_PASSED}")
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SIG=$(TS="${TS}" BODY="${BODY}" "${NODE_BIN}" -e 'const c=require("crypto");const h=c.createHmac("sha256",process.env.IMPROVE_SCORE_KEY);h.update(process.env.TS+"."+process.env.BODY);process.stdout.write(h.digest("hex"))')
          echo "Posting score report for ${ATTEMPT_ID}:"
          echo "${BODY}"
          # A shakedown dispatch (the literal RUN_ID "shakedown") has no run row in
          # the Worker, so its report is answered 409 "unknown run" by design, AFTER
          # the signature verified (a bad signature is 401 before the run lookup).
          # That one answer, on that one RUN_ID, is success: it proves the pipeline
          # end to end. Any other non-2xx, and a 409 on a real run id, still fails
          # this step loudly.
          RESPONSE_FILE=$(mktemp)
          STATUS=$(/usr/bin/curl --silent --show-error -o "${RESPONSE_FILE}" -w '%{http_code}' \
            -X POST "${CAPSID_URL}/improve/score" \
            -H "Content-Type: application/json" \
            -H "X-Improve-Namespace: ${IMPROVE_NAMESPACE}" \
            -H "X-Improve-Timestamp: ${TS}" \
            -H "X-Improve-Signature: ${SIG}" \
            --data "${BODY}")
          cat "${RESPONSE_FILE}"; echo
          case "${STATUS}" in 2*) exit 0 ;; esac
          if [ "${STATUS}" = "409" ] && [ "${RUN_ID}" = "shakedown" ] && grep -q "unknown run" "${RESPONSE_FILE}"; then
            echo "shakedown accepted: the Worker verified the signature and refused the nonexistent run, which is the expected terminal answer."
            exit 0
          fi
          echo "score report rejected (HTTP ${STATUS})" >&2
          exit 1
