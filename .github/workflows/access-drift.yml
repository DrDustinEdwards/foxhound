name: access-drift

# I2: the weekly check that the Cloudflare Access application in front of /admin lets in exactly the admins Foxhound
# names (site-runtime's site-runtime-access-drift, at the version package.json pins). It reads the application's
# policies through the Cloudflare API and compares them with ADMIN_EMAILS, kept equal to the Worker's own and held as a
# secret, not a variable, so the addresses stay out of the public log headers. A person let in by one and not the other,
# or an open rule (a domain, everyone, a Bypass), fails the run, and the failed run is the alert. ACCESS_READ_TOKEN is a token with Access: Apps and Policies Read (and Zero Trust Read for an email list)
# and nothing else, so the check changes nothing. Until that secret exists the run says so and passes.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: access-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.ACCESS_READ_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      ACCESS_APP_NAME: ${{ vars.ACCESS_APP_NAME }}
    steps:
      - name: Is the check set up?
        id: setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=I2 access drift::Skipped: the ACCESS_READ_TOKEN secret is not set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ADMIN_EMAILS" ] || [ -z "$ACCESS_APP_NAME" ]; then
            echo "::error title=I2 access drift::Set the ADMIN_EMAILS secret and the CLOUDFLARE_ACCOUNT_ID and ACCESS_APP_NAME repository variables."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.setup.outputs.ready == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.setup.outputs.ready == 'true'
        run: npm ci --ignore-scripts

      - name: Compare Access with ADMIN_EMAILS
        if: steps.setup.outputs.ready == 'true'
        run: npx site-runtime-access-drift --account "$CLOUDFLARE_ACCOUNT_ID" --app "$ACCESS_APP_NAME"
